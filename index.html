<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inta Zenite Produção</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e3a6e">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inta Zenite">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #f6f3ec;
    --card: #ffffff;
    --ink: #1c2333;
    --muted: #6b6f7d;
    --royal: #1e3a6e;
    --royal-dark: #142a53;
    --gold: #a1783f;
    --border: #e2dccd;
    --danger: #9c3b3b;
    --ok: #2e7d4f;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161c; --card: #1d212b; --ink: #f1efe9; --muted: #9aa0ab;
      --royal: #4f74b8; --royal-dark: #3a5a95; --gold: #c9a468; --border: #2d323f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161c; --card: #1d212b; --ink: #f1efe9; --muted: #9aa0ab;
    --royal: #4f74b8; --royal-dark: #3a5a95; --gold: #c9a468; --border: #2d323f;
  }
  html{height:100%;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 96px;}
  .eyebrow{font-size:12px;color:var(--gold);letter-spacing:.04em;text-transform:uppercase;margin:0 0 4px;}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:22px;margin:0 0 4px;}
  h2{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:18px;margin:0 0 12px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;}
  .muted{color:var(--muted);font-size:13px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--royal);color:#fff;border:none;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;}
  .btn:active{background:var(--royal-dark);}
  .btn.gold{background:var(--gold);}
  .btn.ghost{background:transparent;color:var(--royal);border:1px solid var(--border);}
  .btn.danger{background:var(--danger);}
  .btn.sm{padding:8px 12px;font-size:13px;border-radius:8px;}
  .btn.block{width:100%;}
  input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:11px 12px;font-size:15px;color:var(--ink);font-family:inherit;}
  label{font-size:13px;color:var(--muted);display:block;margin:10px 0 4px;}
  .row{display:flex;gap:8px;}
  .row > *{flex:1;}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;letter-spacing:.02em;}
  .pill.aguardando{background:#e7e2d3;color:#6b5f3f;}
  .pill.em_producao{background:#dde6f5;color:var(--royal);}
  .pill.pronto{background:#d9ecdf;color:var(--ok);}
  .pill.entregue{background:#e2dccd;color:var(--muted);}
  .pill.urgente{background:#f3d9d9;color:var(--danger);}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .navbottom{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;padding:6px env(safe-area-inset-left,0) calc(6px + env(safe-area-inset-bottom,0)) env(safe-area-inset-right,0);z-index:50;}
  .navbottom button{flex:1;background:none;border:none;color:var(--muted);font-size:11px;font-family:inherit;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;}
  .navbottom button.active{color:var(--royal);font-weight:700;}
  .navbottom svg{width:20px;height:20px;}
  .item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);gap:10px;}
  .item:last-child{border-bottom:none;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
  .modal{background:var(--card);width:100%;max-width:640px;max-height:90vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0));}
  .modal h2{display:flex;justify-content:space-between;align-items:center;}
  .close{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;}
  .fab{position:fixed;bottom:76px;right:16px;background:var(--gold);color:#fff;border:none;border-radius:50%;width:54px;height:54px;font-size:26px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:40;cursor:pointer;}
  .center{text-align:center;}
  .spinner{border:3px solid var(--border);border-top-color:var(--royal);border-radius:50%;width:28px;height:28px;animation:spin .8s linear infinite;margin:24px auto;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .segmented{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:3px;margin-bottom:14px;}
  .segmented button{flex:1;border:none;background:none;padding:8px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;}
  .segmented button.active{background:var(--card);color:var(--royal);}
  .stat{display:flex;gap:10px;}
  .stat .card{flex:1;text-align:center;padding:12px;}
  .stat .num{font-family:'Fraunces',Georgia,serif;font-size:22px;font-weight:600;}
  a{color:var(--royal);}
  .foto-thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;border:1px solid var(--border);}
  .checkline{display:flex;align-items:center;gap:10px;}
  .checkline input[type=checkbox]{width:auto;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;}
  .chip{border:1px solid var(--border);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
  .chip.active{background:var(--royal);color:#fff;border-color:var(--royal);}
  .chip-foto{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 10px;border-radius:12px;}
  .chip-foto img{width:48px;height:48px;border-radius:8px;object-fit:cover;}
  .chip-foto span{font-size:11px;font-weight:600;}
  .error{color:var(--danger);font-size:13px;margin-top:6px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ---------- CONFIG ----------
const SUPABASE_URL = "https://ldkgwtdlajoodwsattex.supabase.co";
const SUPABASE_KEY = "sb_publishable_HUFpcJLnKSeQ3EiXXco0iw_PXv73xgO";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true,
    storage: window.localStorage,
  },
});

const STATUS_LABEL = {aguardando:'Aguardando', em_producao:'Em produção', pronto:'Pronto', entregue:'Entregue'};
const STATUS_NEXT = {aguardando:'em_producao', em_producao:'pronto', pronto:'entregue'};

let state = {
  session: null,
  tab: 'hoje',
  hojeData: new Date().toISOString().slice(0,10),
  pessoaTipo: 'costureiras',
  materiaisView: 'lista',
  estoqueCat: 'Todas',
  produtos: { potenciaId: null, tipoId: null, ritoId: null, cargoId: null },
};

const app = document.getElementById('app');

function fmtDate(d){
  if(!d) return '';
  const [y,m,day] = d.split('-');
  return `${day}/${m}/${y}`;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function money(v){ return (v==null?0:Number(v)).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }

// ---------- FOTOS DE FICHAS (produtos) ----------
function fichaThumbUrl(f){
  const fotos = (f?.ficha_fotos||[]).slice().sort((a,b)=>a.ordem-b.ordem);
  return fotos[0]?.url || '';
}
function fichaThumbImg(f, size){
  size = size || 44;
  const url = fichaThumbUrl(f);
  if(!url) return `<div class="foto-thumb" style="width:${size}px;height:${size}px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted);text-align:center;">sem foto</div>`;
  return `<img src="${url}" class="foto-thumb" style="width:${size}px;height:${size}px;flex-shrink:0;">`;
}
async function uploadFotoFicha(fichaId, file){
  const ext = (file.name.split('.').pop()||'jpg').toLowerCase();
  const path = `${fichaId}/${Date.now()}.${ext}`;
  const { error: upErr } = await sb.storage.from('fotos').upload(path, file, { upsert: true, contentType: file.type });
  if(upErr) return { error: upErr };
  const { data } = sb.storage.from('fotos').getPublicUrl(path);
  const { error } = await sb.from('ficha_fotos').insert({ ficha_id: fichaId, url: data.publicUrl });
  return { error };
}
async function editarFotoFicha(fichaId, nome){
  const { data: fotos } = await sb.from('ficha_fotos').select('*').eq('ficha_id', fichaId).order('ordem');
  showModal(`
    <h2>Foto — ${nome} <button class="close" onclick="closeModal()">&times;</button></h2>
    <div id="ff-fotos" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
      ${(fotos||[]).map(f=>`
        <div style="position:relative;">
          <img src="${f.url}" class="foto-thumb" style="width:80px;height:80px;">
          <button class="btn danger sm" style="position:absolute;top:-6px;right:-6px;padding:1px 7px;border-radius:50%;" onclick="removerFotoFicha('${f.id}','${fichaId}','${nome.replace(/'/g,"\\'")}')">&times;</button>
        </div>`).join('') || '<p class="muted">Nenhuma foto ainda.</p>'}
    </div>
    <label>Adicionar foto (câmera ou galeria)</label>
    <input type="file" id="ff-foto" accept="image/*">
    <button class="btn block gold" style="margin-top:14px;" onclick="salvarFotoFicha('${fichaId}','${nome.replace(/'/g,"\\'")}')">Enviar foto</button>
    <p id="ff-msg" class="error"></p>
  `);
}
async function salvarFotoFicha(fichaId, nome){
  const file = document.getElementById('ff-foto').files[0];
  const msg = document.getElementById('ff-msg');
  if(!file){ msg.textContent='Escolha uma foto.'; return; }
  msg.textContent = 'Enviando...'; msg.className='muted';
  const { error } = await uploadFotoFicha(fichaId, file);
  if(error){ msg.textContent = error.message; msg.className='error'; return; }
  await editarFotoFicha(fichaId, nome);
}
async function removerFotoFicha(fotoId, fichaId, nome){
  await sb.from('ficha_fotos').delete().eq('id', fotoId);
  await editarFotoFicha(fichaId, nome);
}
function fichaPickerListHtml(fichas, onClickFnName){
  return (fichas||[]).map(f=>{
    const url = fichaThumbUrl(f);
    return `
    <div class="item calc-opcao" data-nome="${(f.nome||'').toLowerCase()}" style="cursor:pointer;padding:8px 10px;" onclick="${onClickFnName}('${f.id}')">
      ${url?`<img src="${url}" class="foto-thumb">`:`<div class="foto-thumb" style="display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:9px;text-align:center;">sem foto</div>`}
      <div style="flex:1;">
        <div>${f.nome}</div>
        <div class="muted" style="font-size:11px;">${f.unidade_producao}</div>
      </div>
      <button class="btn ghost sm" onclick="event.stopPropagation(); editarFotoFicha('${f.id}','${(f.nome||'').replace(/'/g,"\\'")}')">📷</button>
    </div>`;
  }).join('') || '<p class="muted" style="padding:10px;">Nenhum tipo de peça cadastrado ainda.</p>';
}
function filtrarFichaPicker(inputId, listId){
  const q = document.getElementById(inputId).value.toLowerCase();
  document.querySelectorAll('#'+listId+' .calc-opcao').forEach(el=>{
    el.style.display = el.dataset.nome.includes(q) ? 'flex' : 'none';
  });
}

// ---------- BOOT ----------
async function boot(){
  const { data } = await sb.auth.getSession();
  state.session = data.session;
  sb.auth.onAuthStateChange((_event, session) => {
    state.session = session;
    render();
  });
  render();
}
boot();

function render(){
  // acesso direto, sem login por e-mail
  renderApp();
}

// ---------- LOGIN ----------
function renderLogin(){
  app.innerHTML = `
    <div class="wrap" style="padding-top:70px;">
      <div class="center" style="margin-bottom:30px;">
        <p class="eyebrow">Inta Zenite</p>
        <h1 style="font-size:28px;">Produção</h1>
        <p class="muted">Controle de produção dos paramentos</p>
      </div>
      <div class="card">
        <label>Seu e-mail</label>
        <input id="login-email" type="email" placeholder="allynekarvalho@hotmail.com" autocomplete="email">
        <button class="btn block" style="margin-top:14px;" onclick="doLogin()">Enviar link de acesso</button>
        <p id="login-msg" class="muted" style="margin-top:10px;"></p>
      </div>
    </div>`;
}

async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const msg = document.getElementById('login-msg');
  if(!email){ msg.textContent = 'Digite seu e-mail.'; msg.className='error'; return; }
  msg.textContent = 'Enviando...'; msg.className='muted';
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: window.location.href } });
  if(error){ msg.textContent = 'Erro: ' + error.message; msg.className='error'; return; }
  msg.textContent = 'Link enviado! Abra seu e-mail e toque no link pra entrar.';
  msg.className='muted';
}

// ---------- APP SHELL ----------
function renderApp(){
  app.innerHTML = `
    <div class="wrap">
      <div class="topbar">
        <div>
          <p class="eyebrow">Inta Zenite</p>
          <h1>Produção</h1>
        </div>
      </div>
      <div id="content"></div>
    </div>
    <div class="navbottom">
      ${navBtn('hoje','Hoje')}
      ${navBtn('pedidos','Pedidos')}
      ${navBtn('produtos','Produtos')}
      ${navBtn('materiais','Estoque')}
      ${navBtn('costureiras','Equipe')}
    </div>
  `;
  loadTab();
}
function navBtn(id,label){
  return `<button class="${state.tab===id?'active':''}" onclick="switchTab('${id}')">${label}</button>`;
}
function switchTab(id){ state.tab = id; state.materiaisView = 'lista'; renderApp(); }

function loadTab(){
  const c = document.getElementById('content');
  c.innerHTML = `<div class="spinner"></div>`;
  if(state.tab==='hoje') renderHoje();
  else if(state.tab==='pedidos') renderPedidos();
  else if(state.tab==='costureiras') renderEquipe();
  else if(state.tab==='produtos') renderProdutos();
  else if(state.tab==='materiais') renderMateriais();
  else if(state.tab==='relatorio') renderRelatorio();
}

// ================= HOJE =================
async function renderHoje(){
  const c = document.getElementById('content');
  const dia = state.hojeData;
  const { data: pecas, error } = await sb.from('pecas')
    .select('*, fichas_tecnicas(nome, ficha_fotos(url,ordem)), pedidos(numero, prazo, urgente, clientes(nome)), costureiras(nome), faccionistas(nome)')
    .eq('dia_producao', dia)
    .order('criado_em');

  let html = `
    <div class="row" style="margin-bottom:14px;">
      <button class="btn ghost sm" onclick="mudarDia(-1)">‹ Anterior</button>
      <input type="date" value="${dia}" onchange="state.hojeData=this.value; loadTab();" style="text-align:center;">
      <button class="btn ghost sm" onclick="mudarDia(1)">Próximo ›</button>
    </div>`;

  if(error){ html += `<p class="error">Erro ao carregar: ${error.message}</p>`; c.innerHTML = html; return; }
  if(!pecas || pecas.length===0){
    html += `<div class="card center muted">Nada programado para ${fmtDate(dia)}.</div>`;
    c.innerHTML = html; return;
  }

  // ordenar urgentes/prazo vencendo no topo
  pecas.sort((a,b) => {
    const au = a.pedidos?.urgente ? 0 : 1, bu = b.pedidos?.urgente ? 0 : 1;
    return au - bu;
  });

  html += pecas.map(p => {
    const urgente = p.pedidos?.urgente;
    const prazo = p.pedidos?.prazo;
    const venceLogo = prazo && (new Date(prazo) - new Date(dia))/86400000 <= 2;
    const quem = p.costureiras?.nome || p.faccionistas?.nome || '—';
    return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
        <div style="display:flex;gap:10px;">
          ${fichaThumbImg(p.fichas_tecnicas)}
          <div>
            <strong>${p.fichas_tecnicas?.nome || 'Peça'}</strong> ×${p.quantidade}
            <div class="muted">${p.pedidos?.clientes?.nome || ''} · Pedido #${p.pedidos?.numero || ''}</div>
            <div class="muted">Responsável: ${quem}</div>
          </div>
        </div>
        <div style="text-align:right;">
          ${urgente ? '<span class="pill urgente">Urgente</span>' : ''}
          ${venceLogo ? `<div class="muted" style="color:var(--danger);font-size:11px;">Prazo ${fmtDate(prazo)}</div>` : ''}
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;">
        <span class="pill ${p.status}">${STATUS_LABEL[p.status]}</span>
        ${STATUS_NEXT[p.status] ? `<button class="btn sm" onclick="avancarStatus('${p.id}','${STATUS_NEXT[p.status]}')">Marcar ${STATUS_LABEL[STATUS_NEXT[p.status]]}</button>` : ''}
      </div>
    </div>`;
  }).join('');

  c.innerHTML = html;
}
function mudarDia(delta){
  const d = new Date(state.hojeData + 'T12:00:00');
  d.setDate(d.getDate()+delta);
  state.hojeData = d.toISOString().slice(0,10);
  loadTab();
}
async function avancarStatus(id, novo){
  const patch = { status: novo };
  if(novo === 'pronto') patch.data_pronto = todayISO();
  const { error } = await sb.from('pecas').update(patch).eq('id', id);
  if(error){ alert('Erro: ' + error.message); return; }
  loadTab();
}

// ================= PRODUTOS (catálogo: potência / tipo / rito) =================
function chipsHtml(items, selectedId, fnName){
  return (items||[]).map(it => `
    <button type="button" class="chip ${it.id===selectedId?'active':''}" data-nome="${(it.nome||'').toLowerCase()}" onclick="${fnName}('${it.id}')">${it.nome}</button>
  `).join('') || '<p class="muted" style="padding:4px 0;">Nenhum cadastrado ainda.</p>';
}
function filtrarChips(inputId, listId){
  const q = document.getElementById(inputId).value.toLowerCase();
  document.querySelectorAll('#'+listId+' .chip').forEach(el=>{
    el.style.display = el.dataset.nome.includes(q) ? 'inline-flex' : 'none';
  });
}

async function renderProdutos(){
  const c = document.getElementById('content');
  const [{ data: potencias }, { data: tipos }] = await Promise.all([
    sb.from('potencias').select('*').order('nome'),
    sb.from('tipos_peca').select('*').order('nome'),
  ]);
  window._prodPotencias = potencias||[];
  window._prodTipos = tipos||[];

  let ritos = [];
  if(state.produtos.potenciaId){
    const { data } = await sb.from('ritos').select('*').eq('potencia_id', state.produtos.potenciaId).order('nome');
    ritos = data||[];
  }
  window._prodRitos = ritos;

  let html = `
    <h2 style="font-size:15px;">Potência</h2>
    <div class="row">
      <input id="prod-busca-potencia" placeholder="Buscar ou digitar nova potência..." oninput="filtrarChips('prod-busca-potencia','prod-lista-potencia')">
      <button class="btn ghost sm" onclick="criarPotenciaProduto()">+ Adicionar</button>
    </div>
    <div id="prod-lista-potencia" class="chips">
      ${chipsHtml(potencias, state.produtos.potenciaId, 'selecionarPotenciaProduto')}
    </div>`;

  if(state.produtos.potenciaId){
    html += `
    <h2 style="font-size:15px;margin-top:22px;">Tipo de peça</h2>
    <div class="row">
      <input id="prod-busca-tipo" placeholder="Buscar ou digitar novo tipo..." oninput="filtrarChips('prod-busca-tipo','prod-lista-tipo')">
      <button class="btn ghost sm" onclick="criarTipoProduto()">+ Adicionar</button>
    </div>
    <div id="prod-lista-tipo" class="chips">
      ${chipsHtml(tipos, state.produtos.tipoId, 'selecionarTipoProduto')}
    </div>

    <h2 style="font-size:15px;margin-top:22px;">Rito</h2>
    <div class="row">
      <input id="prod-busca-rito" placeholder="Buscar ou digitar novo rito..." oninput="filtrarChips('prod-busca-rito','prod-lista-rito')">
      <button class="btn ghost sm" onclick="criarRitoProduto()">+ Adicionar</button>
    </div>
    <div id="prod-lista-rito" class="chips">
      ${chipsHtml(ritos, state.produtos.ritoId, 'selecionarRitoProduto')}
    </div>

async function criarOuSelecionarCatalogo(tabela, nome, extraCols, listaExistente, fnSelecionar){
  const existente = (listaExistente||[]).find(x => x.nome.toLowerCase() === nome.toLowerCase());
  if(existente){ fnSelecionar(existente.id); return true; }
  const { data, error } = await sb.from(tabela).insert({ nome, ...extraCols }).select().single();
  if(error){ alert(error.message); return false; }
  fnSelecionar(data.id);
  return true;
}
async function criarPotenciaProduto(){

async function criarRitoProduto(){

async function carregarProdutosFiltrados(){
  let q = sb.from('fichas_tecnicas').select('*, ficha_fotos(url,ordem)').eq('ativo', true)
    .eq('potencia_id', state.produtos.potenciaId).eq('tipo_peca_id', state.produtos.tipoId);
  if(state.produtos.ritoId) q = q.eq('rito_id', state.produtos.ritoId);

          <div><strong>${f.nome}</strong><div class="muted">${f.unidade_producao}</div></div>
        </div>
      </div>`).join('') || '<p class="muted">Nenhum produto cadastrado com essa combinação ainda.</p>'}
    <button class="btn block gold" style="margin-top:10px;" onclick="novoProdutoCompleto()">+ Novo produto</button>
  `;
}

async function uploadParaStorage(prefixoPasta, file){
  const ext = (file.name.split('.').pop()||'jpg').toLowerCase();
  const path = `${prefixoPasta}/${Date.now()}.${ext}`;
  const { error } = await sb.storage.from('fotos').upload(path, file, { upsert: true, contentType: file.type });
  if(error) return { error };
  const { data } = sb.storage.from('fotos').getPublicUrl(path);
  return { url: data.publicUrl };
}

// ===== Lista de materiais do produto (reaproveita o cadastro de Materiais/estoque) =====
const CATEGORIAS_MATERIAL = ['Orlado','Forro','Ferragens','Metais maçônicos','Elástico','Outro'];
function slugCat(c){ return c.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-'); }
window._pmSel = window._pmSel || {};

async function carregarMateriaisCategorias(){
  const { data } = await sb.from('materiais').select('id,nome,categoria,foto_url,unidade,estoque_atual').order('nome');
  const map = {};
  (data||[]).forEach(m => { const cat = m.categoria || 'Outro'; (map[cat]=map[cat]||[]).push(m); });
  window._prodMateriais = map;
}
function materialDe(id){
  for(const cat in (window._prodMateriais||{})){
    const m = window._prodMateriais[cat].find(x=>x.id===id);
    if(m) return m;
  }
  return null;
}
function materialChipsHtml(prefix, materiais, selecionados){
  return (materiais||[]).map(m => {
    const ativo = selecionados[m.id] ? 'active' : '';
    if(m.foto_url){
      return `<button type="button" class="chip chip-foto ${ativo}" data-nome="${m.nome.toLowerCase()}" onclick="toggleMaterialSelecionado('${prefix}','${m.id}')">
        <img src="${m.foto_url}" alt=""><span>${m.nome}</span></button>`;
    }
    return `<button type="button" class="chip ${ativo}" data-nome="${m.nome.toLowerCase()}" onclick="toggleMaterialSelecionado('${prefix}','${m.id}')">${m.nome}</button>`;
  }).join('') || '<p class="muted" style="padding:4px 0;">Nenhum material cadastrado ainda.</p>';
}
function toggleMaterialSelecionado(prefix, materialId){
  window._pmSel[prefix] = window._pmSel[prefix] || {};
  if(materialId in window._pmSel[prefix]) delete window._pmSel[prefix][materialId];
  else window._pmSel[prefix][materialId] = null; // obriga a informar a medida usada nesse paramento
  rerenderMateriaisProduto(prefix);
}
function selecionadosMateriaisHtml(prefix){
  const sel = window._pmSel[prefix] || {};
  const ids = Object.keys(sel);
  if(!ids.length) return '<p class="muted">Nenhum material selecionado ainda.</p>';
  return ids.map(id => {
    const m = materialDe(id);
    if(!m) return '';
    const qtdBruta = sel[id];
    const qtd = Number(qtdBruta) || 0;
    const estoque = Number(m.estoque_atual) || 0;
    const falta = qtd - estoque;
    const fmt = (v) => m.unidade === 'cm' ? formatMedida(v, 'cm') : `${v} ${m.unidade||''}`;
    const detalhe = [m.marca, (m.cor&&m.numero)?`${m.cor} ${m.numero}`:(m.cor||m.numero), m.tamanho?`tam. ${m.tamanho}`:null].filter(Boolean).join(' · ');
    return `<div class="item" style="flex-direction:column;align-items:flex-start;gap:4px;">
      <div style="display:flex;justify-content:space-between;width:100%;align-items:center;">
        <div style="display:flex;gap:8px;align-items:center;">
          ${m.foto_url?`<img src="${m.foto_url}" class="foto-thumb" style="width:32px;height:32px;">`:''}
          <div><span>${m.nome}</span>${detalhe?`<div class="muted" style="font-size:11px;">${detalhe}</div>`:''}</div>
        </div>
        <button type="button" class="btn ghost sm" onclick="toggleMaterialSelecionado('${prefix}','${id}')">Remover</button>
      </div>
      <label style="font-size:12px;margin:2px 0 0;">Medida usada neste paramento (${m.unidade||'un.'})</label>
      <input type="number" step="0.01" placeholder="Ex: ${m.unidade==='cm'?'90':'1'}" value="${qtdBruta==null?'':qtdBruta}" style="width:110px;" oninput="window._pmSel['${prefix}']['${id}']=this.value===''?null:(Number(this.value)||0); atualizarEstoqueItem('${prefix}','${id}');">
      <div class="muted" id="${prefix}-estoque-${id}" style="font-size:12px;">${qtdBruta==null ? 'Informe a medida pra ver o que falta no estoque.' : `Em estoque: ${fmt(estoque)}${falta>0?` — <span style="color:#c0392b;font-weight:600;">falta ${fmt(falta)}</span>`:' — ok pra essa quantidade'}`}</div>
    </div>`;
  }).join('');
}
function atualizarEstoqueItem(prefix, materialId){
  const m = materialDe(materialId);
  if(!m) return;
  const el = document.getElementById(`${prefix}-estoque-${materialId}`);
  if(!el) return;
  const qtdBruta = (window._pmSel[prefix]||{})[materialId];
  if(qtdBruta == null){ el.textContent = 'Informe a medida pra ver o que falta no estoque.'; return; }
  const qtd = Number(qtdBruta) || 0;
  const estoque = Number(m.estoque_atual) || 0;
  const falta = qtd - estoque;
  const fmt = (v) => m.unidade === 'cm' ? formatMedida(v, 'cm') : `${v} ${m.unidade||''}`;
  el.innerHTML = `Em estoque: ${fmt(estoque)}${falta>0?` — <span style="color:#c0392b;font-weight:600;">falta ${fmt(falta)}</span>`:' — ok pra essa quantidade'}`;
}
function rerenderMateriaisProduto(prefix){
  CATEGORIAS_MATERIAL.forEach(cat => {
    const slug = slugCat(cat);
    const el = document.getElementById(`${prefix}-mat-chips-${slug}`);
    if(el) el.innerHTML = materialChipsHtml(prefix, (window._prodMateriais||{})[cat]||[], window._pmSel[prefix]||{});
  });
  const selDiv = document.getElementById(`${prefix}-mat-selecionados`);
  if(selDiv) selDiv.innerHTML = selecionadosMateriaisHtml(prefix);
}
async function criarMaterialRapido(prefix, categoria){
  const slug = slugCat(categoria);
  const input = document.getElementById(`${prefix}-novo-mat-${slug}`);
  const nome = input.value.trim();
  if(!nome) return;
  const { data, error } = await sb.from('materiais').insert({ nome, categoria, unidade: 'peça' }).select().single();
  if(error){ alert(error.message); return; }
  window._prodMateriais[categoria] = window._prodMateriais[categoria] || [];
  window._prodMateriais[categoria].push(data);
  window._prodMateriais[categoria].sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
  window._pmSel[prefix] = window._pmSel[prefix] || {};
  window._pmSel[prefix][data.id] = null;
  input.value = '';
  rerenderMateriaisProduto(prefix);
}
function categoriaMateriaisHtml(prefix, categoria){
  const slug = slugCat(categoria);
  const materiais = (window._prodMateriais||{})[categoria] || [];
  return `
    <h2 style="font-size:15px;margin-top:18px;">${categoria}</h2>
    <input placeholder="Buscar ${categoria.toLowerCase()}..." oninput="filtrarChips(this.id,'${prefix}-mat-chips-${slug}')" id="${prefix}-busca-mat-${slug}">
    <div id="${prefix}-mat-chips-${slug}" class="chips">
      ${materialChipsHtml(prefix, materiais, window._pmSel[prefix]||{})}
    </div>
    <div class="row" style="margin-top:6px;">
      <input id="${prefix}-novo-mat-${slug}" placeholder="Nome do novo material">
      <button type="button" class="btn ghost sm" onclick="criarMaterialRapido('${prefix}','${categoria}')">+ Adicionar</button>
    </div>
  `;
}
function listaMateriaisHtml(prefix, outrosAviamentos){
  return `
    <h2 style="font-size:15px;margin-top:22px;">Lista de materiais</h2>
    <p class="muted">Pode escolher mais de uma opção em cada categoria. Fornecedor, cor, numeração e foto de cada material se editam na aba Materiais.</p>
    ${CATEGORIAS_MATERIAL.map(cat=>categoriaMateriaisHtml(prefix, cat)).join('')}
    <h2 style="font-size:15px;margin-top:18px;">Selecionados</h2>
    <div id="${prefix}-mat-selecionados">${selecionadosMateriaisHtml(prefix)}</div>
    <label style="margin-top:12px;">Outras observações</label>
    <textarea id="${prefix}-outros_aviamentos" rows="2" placeholder="Qualquer outro detalhe...">${(outrosAviamentos||'').replace(/</g,'&lt;')}</textarea>
  `;
}
// retorna o nome do primeiro material selecionado sem medida informada, ou null se tudo ok
function materiaisSemMedida(prefix){
  const sel = window._pmSel[prefix] || {};
  for(const materialId in sel){
    if(sel[materialId] == null){
      const m = materialDe(materialId);
      return m ? m.nome : 'um material';
    }
  }
  return null;
}
async function salvarListaMateriais(prefix, fichaId){
  await sb.from('ficha_materiais').delete().eq('ficha_id', fichaId);
  const sel = window._pmSel[prefix] || {};
  const linhas = Object.keys(sel).map((materialId, i) => ({
    ficha_id: fichaId, material_id: materialId, quantidade_por_unidade: sel[materialId], ordem: i,
  }));
  if(linhas.length) await sb.from('ficha_materiais').insert(linhas);
}

async function novoProdutoCompleto(){
  await carregarMateriaisCategorias();
  window._pmSel['npf'] = {};
  const potNome = (window._prodPotencias||[]).find(p=>p.id===state.produtos.potenciaId)?.nome || '';
  const tipoNome = (window._prodTipos||[]).find(t=>t.id===state.produtos.tipoId)?.nome || '';
  const ritoNome = (window._prodRitos||[]).find(r=>r.id===state.produtos.ritoId)?.nome || '';
  const cargoNome = (window._prodCargos||[]).find(c=>c.id===state.produtos.cargoId)?.nome || '';
  const sugestao = [tipoNome, cargoNome, potNome, ritoNome].filter(Boolean).join(' ');
  showModal(`
    <h2>Novo produto <button class="close" onclick="closeModal()">&times;</button></h2>
    <label>Nome do produto</label>
    <input id="npf-nome" value="${sugestao.replace(/"/g,'&quot;')}">
    <label>Unidade de produção</label>
    <input id="npf-unidade" placeholder="peça, par, avental...">
    <label>Foto do produto (opcional)</label>
    <input type="file" id="npf-foto" accept="image/*">
    ${listaMateriaisHtml('npf', '')}
    <button class="btn block gold" style="margin-top:16px;" onclick="salvarProdutoCompleto()">Salvar</button>
    <p id="npf-msg" class="error"></p>
  `);
}
async function salvarProdutoCompleto(){
  const nome = document.getElementById('npf-nome').value.trim();
  const unidade_producao = document.getElementById('npf-unidade').value.trim() || 'peça';
  const msg = document.getElementById('npf-msg');
  if(!nome){ msg.textContent = 'Informe o nome.'; return; }
  const semMedida = materiaisSemMedida('npf');
  if(semMedida){ msg.textContent = `Informe a medida usada de "${semMedida}" nesse paramento.`; return; }
  const payload = {
    nome, unidade_producao,
    potencia_id: state.produtos.potenciaId,
    tipo_peca_id: state.produtos.tipoId,
    rito_id: state.produtos.ritoId || null,
    cargo_id: state.produtos.cargoId || null,
    outros_aviamentos: document.getElementById('npf-outros_aviamentos').value.trim() || null,
  };
  const { data, error } = await sb.from('fichas_tecnicas').insert(payload).select().single();
  if(error){ msg.textContent = error.message; return; }
  await salvarListaMateriais('npf', data.id);
  const file = document.getElementById('npf-foto').files[0];
  if(file){
    const { error: fotoErr } = await uploadFotoFicha(data.id, file);
    if(fotoErr){ msg.textContent = 'Produto salvo, mas a foto falhou: ' + fotoErr.message; }
  }
  closeModal();
  carregarProdutosFiltrados();
}

// editor completo de um produto já cadastrado (nome, materiais e fotos)
async function abrirProduto(fichaId){
  await carregarMateriaisCategorias();

  const { data: fm } = await sb.from('ficha_materiais').select('material_id,quantidade_por_unidade').eq('ficha_id', fichaId);
  window._pmSel['epf'] = {};
  (fm||[]).forEach(r => { window._pmSel['epf'][r.material_id] = r.quantidade_por_unidade; });
  const fotos = (f.ficha_fotos||[]).slice().sort((a,b)=>a.ordem-b.ordem);
  showModal(`
    <h2>${f.nome} <button class="close" onclick="closeModal()">&times;</button></h2>
    <label>Nome do produto</label>
    <input id="epf-nome" value="${(f.nome||'').replace(/"/g,'&quot;')}">
    <label>Unidade de produção</label>
    <input id="epf-unidade" value="${(f.unidade_producao||'').replace(/"/g,'&quot;')}">

    <label>Fotos do produto</label>
    <div id="epf-fotos-wrap" style="margin-top:4px;">
      <div id="epf-fotos" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
        ${fotos.map(ft=>`
          <div style="position:relative;">
            <img src="${ft.url}" class="foto-thumb" style="width:70px;height:70px;">
            <button class="btn danger sm" style="position:absolute;top:-6px;right:-6px;padding:1px 7px;border-radius:50%;" onclick="event.stopPropagation(); removerFotoFichaInline('${ft.id}','${fichaId}')">&times;</button>
          </div>`).join('') || '<p class="muted">Nenhuma foto ainda.</p>'}
      </div>
      <label style="margin-top:0;">Adicionar foto</label>
      <input type="file" id="epf-foto" accept="image/*">
    </div>

    ${listaMateriaisHtml('epf', f.outros_aviamentos)}
    <button class="btn block gold" style="margin-top:16px;" onclick="salvarEdicaoProduto('${fichaId}')">Salvar alterações</button>
    <p id="epf-msg" class="error"></p>
  `);
}
async function removerFotoFichaInline(fotoId, fichaId){
  await sb.from('ficha_fotos').delete().eq('id', fotoId);
  abrirProduto(fichaId);
}
async function salvarEdicaoProduto(fichaId){
  const msg = document.getElementById('epf-msg');
  const nome = document.getElementById('epf-nome').value.trim();
  if(!nome){ msg.textContent = 'Informe o nome.'; return; }
  const semMedida = materiaisSemMedida('epf');
  if(semMedida){ msg.textContent = `Informe a medida usada de "${semMedida}" nesse paramento.`; return; }
  const patch = {
    nome,
    unidade_producao: document.getElementById('epf-unidade').value.trim() || 'peça',
    outros_aviamentos: document.getElementById('epf-outros_aviamentos').value.trim() || null,
  };
  const { error } = await sb.from('fichas_tecnicas').update(patch).eq('id', fichaId);
  if(error){ msg.textContent = error.message; return; }
  await salvarListaMateriais('epf', fichaId);
  const fotoInput = document.getElementById('epf-foto');
  const file = fotoInput?.files[0];
  if(file){
    const { error: fotoErr } = await uploadFotoFicha(fichaId, file);
    if(fotoErr){ msg.textContent = 'Salvo, mas a foto falhou: ' + fotoErr.message; return; }
  }
  closeModal();
  carregarProdutosFiltrados();
}

async function renderPedidos(){
  const c = document.getElementById('content');
  const { data: pedidos, error } = await sb.from('pedidos')
    .select('*, clientes(nome), pecas(id,status)')
    .order('criado_em', { ascending: false });

  let html = `<button class="btn block" onclick="abrirNovoPedido()">+ Novo pedido</button><div style="height:14px;"></div>`;
  if(error){ html += `<p class="error">${error.message}</p>`; c.innerHTML = html; return; }
  if(!pedidos || pedidos.length===0){ html += `<div class="card center muted">Nenhum pedido ainda.</div>`; c.innerHTML = html; return; }

  html += pedidos.map(p => {
    const total = p.pecas?.length || 0;
    const prontos = p.pecas?.filter(x=>x.status==='pronto'||x.status==='entregue').length || 0;
    return `
    <div class="card" onclick="abrirPedido('${p.id}')" style="cursor:pointer;">
      <div style="display:flex;justify-content:space-between;">
        <strong>#${p.numero} · ${p.clientes?.nome || ''}</strong>
        ${p.urgente ? '<span class="pill urgente">Urgente</span>' : ''}
      </div>
      <div class="muted">Prazo: ${p.prazo ? fmtDate(p.prazo) : '—'} · ${prontos}/${total} peças prontas</div>
    </div>`;
  }).join('');
  c.innerHTML = html;
}

function responsavelSelectHtml(prefix, costureiras, faccionistas, selCostureiraId, selFaccionistaId){
  const selVal = selCostureiraId ? `c:${selCostureiraId}` : (selFaccionistaId ? `f:${selFaccionistaId}` : '');
  return `
    <label>Quem vai fazer</label>
    <select id="${prefix}-responsavel">
      <option value="">—</option>
      ${(costureiras||[]).length ? `<optgroup label="Costureiras">${costureiras.map(c=>`<option value="c:${c.id}" ${selVal===`c:${c.id}`?'selected':''}>${c.nome}</option>`).join('')}</optgroup>` : ''}
      ${(faccionistas||[]).length ? `<optgroup label="Faccionistas">${faccionistas.map(c=>`<option value="f:${c.id}" ${selVal===`f:${c.id}`?'selected':''}>${c.nome}</option>`).join('')}</optgroup>` : ''}
    </select>
  `;
}
function lerResponsavel(prefix){
  const v = document.getElementById(`${prefix}-responsavel`).value;
  if(!v) return { costureira_id: null, faccionista_id: null };
  const [tipo, id] = v.split(':');
  return tipo==='c' ? { costureira_id: id, faccionista_id: null } : { costureira_id: null, faccionista_id: id };
}
function renderNpPecasList(){

async function materiaisDoPedido(pecas){
  const div = document.getElementById('pedido-materiais'); if(!div) return;
  const fichaIds = [...new Set(pecas.map(p=>p.ficha_id).filter(Boolean))];
  if(!fichaIds.length){ div.textContent = 'Nenhuma peça ainda.'; return; }
  const { data: fm } = await sb.from('ficha_materiais').select('ficha_id, quantidade_por_unidade, materiais(id,nome,unidade,estoque_atual,cor,numero,marca,tamanho)').in('ficha_id', fichaIds);
  const tot = {};
  pecas.forEach(p => (fm||[]).filter(r=>r.ficha_id===p.ficha_id && r.materiais).forEach(r => {
    const k = r.materiais.id; tot[k] = tot[k] || { m: r.materiais, q: 0 };
    tot[k].q += (Number(r.quantidade_por_unidade)||0) * (Number(p.quantidade)||0);
  }));
  const linhas = Object.values(tot);
  if(!linhas.length){ div.textContent = 'Os produtos deste pedido ainda não têm lista de materiais.'; return; }
  div.innerHTML = linhas.map(x => {
    const est = Number(x.m.estoque_atual)||0;
    return `<div class="item"><span style="color:var(--ink);">${x.m.nome}${detalheMaterial(x.m)?`<div class="muted" style="font-size:11px;">${detalheMaterial(x.m)}</div>`:''}</span><span style="text-align:right;white-space:nowrap;"><b style="color:var(--ink);">${fmtQtd(x.q, x.m.unidade)}</b><div style="font-size:11px;color:${est<0?'var(--danger)':'var(--muted)'};">estoque: ${fmtQtd(est, x.m.unidade)}</div></span></div>`;
  }).join('') + '<p class="muted" style="font-size:11px;margin-top:6px;">Esse material já sai do estoque quando a peça é lançada no pedido.</p>';
}

// ================= ESTOQUE (materiais) =================
function escAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function fmtQtd(v, unidade){
  const n = Number(v)||0;
  if(unidade === 'cm') return formatMedida(n, 'cm');
  return `${n.toLocaleString('pt-BR',{maximumFractionDigits:2})} ${unidade||''}`.trim();
}
function detalheMaterial(m){
  return [m.marca, (m.cor&&m.numero)?`${m.cor} ${m.numero}`:(m.cor||m.numero), m.tamanho?`tam. ${m.tamanho}`:null].filter(Boolean).join(' · ');
}
function situacaoMaterial(m){
  const est = Number(m.estoque_atual)||0, min = Number(m.estoque_minimo)||0;
  if(est < 0) return 'falta';
  if(min > 0 && est <= min) return 'baixo';
  return 'ok';
}
async function renderMateriais(){
  if(state.materiaisView === 'calculadora'){ renderCalculadora(); return; }
  const c = document.getElementById('content');
  const { data: materiais, error } = await sb.from('materiais').select('*, fornecedores(nome)').order('nome');
  if(error){ c.innerHTML = `<p class="error">${error.message}</p>`; return; }
  window._estoqueCache = materiais||[];
  const comprar = (materiais||[]).filter(m => situacaoMaterial(m) !== 'ok');
  const filtro = state.estoqueCat || 'Todas';
  const cats = ['Todas', ...CATEGORIAS_MATERIAL];
  let html = `
    <div class="row">
      <button class="btn" onclick="novoMaterial()">+ Novo material</button>
      <button class="btn ghost" onclick="state.materiaisView='calculadora'; loadTab();">🧮 Calcular</button>
    </div>`;
  if(comprar.length){
    html += `
    <div class="card" style="margin-top:14px;border-color:var(--danger);">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
        <strong style="color:var(--danger);">⚠️ Precisa comprar (${comprar.length})</strong>
        <button class="btn ghost sm" onclick="copiarListaCompras()">Copiar lista</button>
      </div>
      ${comprar.map(m => {
        const est = Number(m.estoque_atual)||0, min = Number(m.estoque_minimo)||0;
        const precisa = Math.max(min - est, est < 0 ? -est : 0);
        return `<div class="item" onclick="editarMaterial('${m.id}')" style="cursor:pointer;">
          <span>${m.nome}${detalheMaterial(m)?`<div class="muted" style="font-size:11px;">${detalheMaterial(m)}</div>`:''}</span>
          <span style="text-align:right;white-space:nowrap;"><b>${fmtQtd(precisa, m.unidade)}</b><div class="muted" style="font-size:11px;">tem ${fmtQtd(est, m.unidade)}</div></span>
        </div>`; }).join('')}
    </div>`;
  }
  html += `
    <input id="est-busca" placeholder="🔍 Buscar material..." style="margin-top:14px;" oninput="filtrarEstoque()">
    <div class="chips">${cats.map(ct=>`<button type="button" class="chip ${filtro===ct?'active':''}" onclick="state.estoqueCat='${ct}'; loadTab();">${ct}</button>`).join('')}</div>
    <div id="est-lista"></div>`;
  c.innerHTML = html;
  filtrarEstoque();
}
function filtrarEstoque(){
  const div = document.getElementById('est-lista'); if(!div) return;
  const q = (document.getElementById('est-busca')?.value||'').toLowerCase().trim();
  const filtro = state.estoqueCat || 'Todas';
  const lista = (window._estoqueCache||[]).filter(m => {
    const cat = m.categoria || 'Outro';
    if(filtro !== 'Todas' && cat !== filtro) return false;
    if(!q) return true;
    return [m.nome, m.marca, m.cor, m.numero, m.tamanho, m.referencia, m.fornecedores?.nome].filter(Boolean).join(' ').toLowerCase().includes(q);
  });
  if(!lista.length){ div.innerHTML = '<div class="card center muted">Nenhum material encontrado.</div>'; return; }
  const grupos = {};
  lista.forEach(m => { const cat = m.categoria || 'Outro'; (grupos[cat]=grupos[cat]||[]).push(m); });
  const ordem = CATEGORIAS_MATERIAL.filter(ct => grupos[ct]);
  div.innerHTML = ordem.map(ct => `
    <h2 style="font-size:15px;margin:16px 0 8px;">${ct} <span class="muted" style="font-family:Inter;font-weight:400;">(${grupos[ct].length})</span></h2>
    ${grupos[ct].map(m => {
      const sit = situacaoMaterial(m);
      const cor = sit==='falta' ? 'var(--danger)' : (sit==='baixo' ? '#b7791f' : 'var(--ok)');
      return `
      <div class="card" style="padding:12px;">
        <div style="display:flex;gap:10px;align-items:center;cursor:pointer;" onclick="editarMaterial('${m.id}')">
          ${m.foto_url ? `<img src="${m.foto_url}" class="foto-thumb" style="width:48px;height:48px;">` : `<div class="foto-thumb" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:var(--muted);">📦</div>`}
          <div style="flex:1;min-width:0;">
            <strong>${m.nome}</strong>
            ${detalheMaterial(m)?`<div class="muted" style="font-size:12px;">${detalheMaterial(m)}</div>`:''}
            ${m.fornecedores?.nome?`<div class="muted" style="font-size:12px;">${m.fornecedores.nome}${m.referencia?(' · ref '+m.referencia):''}</div>`:''}
          </div>
          <div style="text-align:right;white-space:nowrap;">
            <div style="font-size:17px;font-weight:700;color:${cor};">${fmtQtd(m.estoque_atual, m.unidade)}</div>
            ${Number(m.estoque_minimo)>0?`<div class="muted" style="font-size:11px;">mín. ${fmtQtd(m.estoque_minimo, m.unidade)}</div>`:''}
          </div>
        </div>
        <div class="row" style="margin-top:10px;">
          <button class="btn ghost sm" onclick="entradaMaterial('${m.id}')">+ Entrada (comprei)</button>
          <button class="btn ghost sm" onclick="editarMaterial('${m.id}')">Editar</button>
        </div>
      </div>`; }).join('')}
  `).join('');
}
function copiarListaCompras(){
  const comprar = (window._estoqueCache||[]).filter(m => situacaoMaterial(m) !== 'ok');
  const porForn = {};
  comprar.forEach(m => { const f = m.fornecedores?.nome || 'Sem fornecedor'; (porForn[f]=porForn[f]||[]).push(m); });
  let txt = '*Lista de compras — Inta Zenite*\n';
  Object.keys(porForn).forEach(f => {
    txt += `\n*${f}*\n`;
    porForn[f].forEach(m => {
      const est = Number(m.estoque_atual)||0, min = Number(m.estoque_minimo)||0;
      const precisa = Math.max(min - est, est < 0 ? -est : 0);
      txt += `• ${m.nome}${detalheMaterial(m)?' ('+detalheMaterial(m)+')':''}${m.referencia?' ref '+m.referencia:''}: ${fmtQtd(precisa, m.unidade)}\n`;
    });
  });
  navigator.clipboard.writeText(txt).then(()=>alert('Lista copiada! É só colar no WhatsApp.')).catch(()=>alert(txt));
}

async function lerFormMaterial(p, msg){
  const nome = document.getElementById(`${p}-nome`).value.trim();
  if(!nome){ msg.textContent = 'Informe o nome do material.'; return null; }
  let fornecedor_id = document.getElementById(`${p}-fornecedor`).value;
  const fornecedorNome = document.getElementById(`${p}-fornecedor-nome`).value.trim();
  if(!fornecedor_id && fornecedorNome){
    const { data, error } = await sb.from('fornecedores').insert({ nome: fornecedorNome }).select().single();
    if(error){ msg.textContent = error.message; return null; }
    fornecedor_id = data.id;
  }
  let foto_url = document.getElementById(`${p}-foto-atual`).value || null;
  const file = document.getElementById(`${p}-foto`).files[0];
  if(file){
    msg.textContent = 'Enviando foto...';
    const up = await uploadParaStorage('materiais', file);
    if(up.error){ msg.textContent = 'Falhou ao enviar a foto: ' + up.error.message; return null; }
    foto_url = up.url;
  } else {
    const op = document.getElementById(`${p}-foto-opcao`)?.value;
    if(op) foto_url = op;
  }
  const v = id => document.getElementById(`${p}-${id}`).value.trim() || null;
  return {
    nome, categoria: v('categoria'), marca: v('marca'), cor: v('cor'), numero: v('numero'), tamanho: v('tamanho'),
    unidade: document.getElementById(`${p}-unidade`).value,
    fornecedor_id: fornecedor_id || null, referencia: v('ref'),
    estoque_atual: Number(document.getElementById(`${p}-estoque`).value) || 0,
    estoque_minimo: Number(document.getElementById(`${p}-minimo`).value) || 0,
    foto_url,
  };
}

async function excluirMaterial(id){
  const { count } = await sb.from('ficha_materiais').select('id', { count: 'exact', head: true }).eq('material_id', id);
  if(count){ alert(`Esse material está em ${count} produto(s). Tire ele dos produtos antes de excluir.`); return; }

// ================= CALCULADORA DE MATERIAIS =================
function formatMedida(valorCm, unidade){
  if(unidade !== 'cm'){ return `${Number(valorCm).toLocaleString('pt-BR',{maximumFractionDigits:2})} ${unidade}`; }
  if(valorCm >= 100){
    return `${(valorCm/100).toLocaleString('pt-BR',{maximumFractionDigits:2})} m`;
  }
  return `${Number(valorCm).toLocaleString('pt-BR',{maximumFractionDigits:2})} cm`;
}

async function renderCalculadora(){

  c.innerHTML = `

    <label>Buscar tipo de peça</label>
    <input id="calc-busca" placeholder="Digite pra filtrar..." oninput="filtrarFichaPicker('calc-busca','calc-lista')">

      ${fichaPickerListHtml(fichas, 'calcSelecionarFicha')}
    </div>
    <div id="calc-resultado"></div>
  `;
}
function calcSelecionarFicha(id){

  const div = document.getElementById('calc-resultado');
  div.innerHTML = `
    <h2 style="font-size:15px;margin-top:18px;">${nome}</h2>
    <label>Quantidade a produzir</label>
    <input id="calc-qtd" type="number" value="1" min="1" oninput="atualizarCalcTotais('${fichaId}')">
    <div id="calc-totais" style="margin-top:10px;"></div>
    <button class="btn ghost block" style="margin-top:10px;" onclick="copiarCalculo('${nome.replace(/'/g,"\\'")}')">Copiar lista (WhatsApp)</button>
  `;
  div.dataset.materiais = JSON.stringify(materiais||[]);
  atualizarCalcTotais(fichaId);
}
// cruza a quantidade necessária com o estoque atual do material e calcula o que vai faltar
function cruzarEstoque(m, total){
  const estoque = Number(m.materiais?.estoque_atual) || 0;
  const falta = total - estoque;
  return { estoque, falta: falta > 0 ? falta : 0 };
}
function atualizarCalcTotais(){
  const div = document.getElementById('calc-resultado');
  const materiais = JSON.parse(div.dataset.materiais || '[]');
  const qtd = Number(document.getElementById('calc-qtd').value) || 0;
  const totaisDiv = document.getElementById('calc-totais');
  totaisDiv.innerHTML = materiais.map(m => {
    const total = Number(m.quantidade_por_unidade) * qtd;
    const unidade = m.materiais?.unidade;
    const fmt = (v) => unidade === 'cm' ? formatMedida(v, 'cm') : `${v} ${unidade||''}`;
    const { estoque, falta } = cruzarEstoque(m, total);
    return `<div class="item" style="flex-direction:column;align-items:flex-start;gap:2px;">
      <div style="display:flex;justify-content:space-between;width:100%;">
        <span>${m.materiais?.nome}</span><span>${fmt(total)}</span>
      </div>
      <div class="muted" style="font-size:12px;">Em estoque: ${fmt(estoque)}${falta>0?` — <span style="color:#c0392b;font-weight:600;">falta ${fmt(falta)}</span>`:' — ok'}</div>
    </div>`;
  }).join('') || '<p class="muted">Sem materiais cadastrados pra essa ficha.</p>';
}
function copiarCalculo(nomeFicha){
  const qtd = document.getElementById('calc-qtd').value;
  const div = document.getElementById('calc-resultado');
  const materiais = JSON.parse(div.dataset.materiais || '[]');
  let texto = `*${nomeFicha}* — ${qtd} un.\n\n`;
  materiais.forEach(m => {
    const total = Number(m.quantidade_por_unidade) * Number(qtd);
    const unidade = m.materiais?.unidade;
    const fmt = (v) => unidade === 'cm' ? formatMedida(v, 'cm') : `${v} ${unidade||''}`;
    const { falta } = cruzarEstoque(m, total);
    texto += `• ${m.materiais?.nome}: ${fmt(total)}${falta>0?` (falta ${fmt(falta)})`:''}\n`;
  });
  navigator.clipboard.writeText(texto).then(()=>alert('Lista copiada!')).catch(()=>alert(texto));
}

// ================= RELATÓRIO MENSAL =================
function periodoAtual(refDate){
  // fecha todo dia 20: período do dia 21 do mês anterior até dia 20 do mês de referência
  const d = refDate ? new Date(refDate+'T12:00:00') : new Date();
  let y = d.getFullYear(), m = d.getMonth();
  if(d.getDate() > 20){ m += 1; }
  const fim = new Date(y, m, 20);
  const inicio = new Date(y, m-1, 21);
  return { inicio: inicio.toISOString().slice(0,10), fim: fim.toISOString().slice(0,10) };
}
let relatorioRef = todayISO();

async function renderRelatorio(){
  const c = document.getElementById('content');
  const { inicio, fim } = periodoAtual(relatorioRef);

  const { data: pecas, error } = await sb.from('pecas')
    .select('*, fichas_tecnicas(nome), pedidos(numero), costureiras(id,nome), faccionistas(id,nome)')
    .eq('status', 'pronto')
    .gte('data_pronto', inicio).lte('data_pronto', fim);
  // também inclui entregue
  const { data: pecas2 } = await sb.from('pecas')
    .select('*, fichas_tecnicas(nome), pedidos(numero), costureiras(id,nome), faccionistas(id,nome)')
    .eq('status', 'entregue')
    .gte('data_pronto', inicio).lte('data_pronto', fim);

  const todas = [...(pecas||[]), ...(pecas2||[])];

  let html = `
    <div class="segmented"><button onclick="state.pessoaTipo='costureiras';loadTab();">Costureiras</button><button onclick="state.pessoaTipo='faccionistas';loadTab();">Faccionistas</button><button class="active">Fechamento</button></div>
    <p class="muted">Fecha todo dia 20. Escolha um dia do período:</p>
    <div class="row" style="margin-bottom:6px;">
      <input type="date" value="${relatorioRef}" onchange="relatorioRef=this.value; loadTab();">
    </div>
    <p class="muted" style="margin-bottom:14px;">Período: ${fmtDate(inicio)} a ${fmtDate(fim)}</p>`;

  if(error){ html += `<p class="error">${error.message}</p>`; c.innerHTML = html; return; }

  const porPessoa = {};
  let totalGeral = 0;
  todas.forEach(p => {
    if(p.costureiras){
      const k = 'c_'+p.costureiras.id;
      porPessoa[k] = porPessoa[k] || { nome: p.costureiras.nome+' (costureira)', itens: [], total: 0 };
      porPessoa[k].itens.push(p);
      porPessoa[k].total += Number(p.valor_costureira||0);
      totalGeral += Number(p.valor_costureira||0);
    }
    if(p.faccionistas){
      const k = 'f_'+p.faccionistas.id;
      porPessoa[k] = porPessoa[k] || { nome: p.faccionistas.nome+' (faccionista)', itens: [], total: 0 };
      porPessoa[k].itens.push(p);
      porPessoa[k].total += Number(p.valor_faccionista||0);
      totalGeral += Number(p.valor_faccionista||0);
    }
  });

  html += `<div class="stat" style="margin-bottom:16px;">
    <div class="card"><div class="num">${todas.length}</div><div class="muted">peças</div></div>
    <div class="card"><div class="num">${money(totalGeral)}</div><div class="muted">total do período</div></div>
  </div>`;

  const keys = Object.keys(porPessoa);
  if(keys.length===0){ html += `<div class="card center muted">Nenhuma peça finalizada nesse período.</div>`; c.innerHTML = html; return; }

  html += keys.map(k => {
    const p = porPessoa[k];
    return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;">
        <strong>${p.nome}</strong>
        <strong>${money(p.total)}</strong>
      </div>
      ${p.itens.map(i=>`<div class="item muted"><span>${i.fichas_tecnicas?.nome} ×${i.quantidade} (#${i.pedidos?.numero})</span><span>${fmtDate(i.data_pronto)}</span></div>`).join('')}
    </div>`;
  }).join('');

  html += `<button class="btn ghost block" style="margin-top:10px;" onclick="window.print()">Imprimir / Salvar PDF</button>`;
  c.innerHTML = html;
}

// ================= MODAL =================
function showModal(html){
  closeModal();
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.id = 'modal-bg';
  bg.onclick = (e) => { if(e.target.id==='modal-bg') closeModal(); };
  bg.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(bg);
}
function closeModal(){
  const m = document.getElementById('modal-bg');
  if(m) m.remove();
}
</script>
