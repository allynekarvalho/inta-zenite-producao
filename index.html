<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zênite Produção</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e3a6e">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zênite">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #f6f3ec;
    --card: #ffffff;
    --ink: #1c2333;
    --muted: #6b6f7d;
    --royal: #1e3a6e;
    --royal-dark: #142a53;
    --gold: #a1783f;
    --border: #e2dccd;
    --danger: #9c3b3b;
    --ok: #2e7d4f;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161c; --card: #1d212b; --ink: #f1efe9; --muted: #9aa0ab;
      --royal: #4f74b8; --royal-dark: #3a5a95; --gold: #c9a468; --border: #2d323f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161c; --card: #1d212b; --ink: #f1efe9; --muted: #9aa0ab;
    --royal: #4f74b8; --royal-dark: #3a5a95; --gold: #c9a468; --border: #2d323f;
  }
  html{height:100%;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 96px;}
  .eyebrow{font-size:12px;color:var(--gold);letter-spacing:.04em;text-transform:uppercase;margin:0 0 4px;}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:22px;margin:0 0 4px;}
  h2{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:18px;margin:0 0 12px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;}
  .muted{color:var(--muted);font-size:13px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--royal);color:#fff;border:none;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;}
  .btn:active{background:var(--royal-dark);}
  .btn.gold{background:var(--gold);}
  .btn.ghost{background:transparent;color:var(--royal);border:1px solid var(--border);}
  .btn.danger{background:var(--danger);}
  .btn.sm{padding:8px 12px;font-size:13px;border-radius:8px;}
  .btn.block{width:100%;}
  input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:11px 12px;font-size:15px;color:var(--ink);font-family:inherit;}
  label{font-size:13px;color:var(--muted);display:block;margin:10px 0 4px;}
  .row{display:flex;gap:8px;}
  .row > *{flex:1;}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;letter-spacing:.02em;}
  .pill.aguardando{background:#e7e2d3;color:#6b5f3f;}
  .pill.em_producao{background:#dde6f5;color:var(--royal);}
  .pill.pronto{background:#d9ecdf;color:var(--ok);}
  .pill.entregue{background:#e2dccd;color:var(--muted);}
  .pill.urgente{background:#f3d9d9;color:var(--danger);}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .navbottom{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;padding:6px env(safe-area-inset-left,0) calc(6px + env(safe-area-inset-bottom,0)) env(safe-area-inset-right,0);z-index:50;}
  .navbottom button{flex:1;background:none;border:none;color:var(--muted);font-size:11px;font-family:inherit;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;}
  .navbottom button.active{color:var(--royal);font-weight:700;}
  .navbottom svg{width:20px;height:20px;}
  .item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);gap:10px;}
  .item:last-child{border-bottom:none;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
  .modal{background:var(--card);width:100%;max-width:640px;max-height:90vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0));}
  .modal h2{display:flex;justify-content:space-between;align-items:center;}
  .close{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;}
  .fab{position:fixed;bottom:76px;right:16px;background:var(--gold);color:#fff;border:none;border-radius:50%;width:54px;height:54px;font-size:26px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:40;cursor:pointer;}
  .center{text-align:center;}
  .spinner{border:3px solid var(--border);border-top-color:var(--royal);border-radius:50%;width:28px;height:28px;animation:spin .8s linear infinite;margin:24px auto;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .segmented{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:3px;margin-bottom:14px;}
  .segmented button{flex:1;border:none;background:none;padding:8px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;}
  .segmented button.active{background:var(--card);color:var(--royal);}
  .stat{display:flex;gap:10px;}
  .stat .card{flex:1;text-align:center;padding:12px;}
  .stat .num{font-family:'Fraunces',Georgia,serif;font-size:22px;font-weight:600;}
  a{color:var(--royal);}
  .foto-thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;border:1px solid var(--border);}
  .checkline{display:flex;align-items:center;gap:10px;}
  .checkline input[type=checkbox]{width:auto;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;}
  .chip{border:1px solid var(--border);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
  .chip.active{background:var(--royal);color:#fff;border-color:var(--royal);}
  .chip-foto{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 10px;border-radius:12px;}
  .chip-foto img{width:48px;height:48px;border-radius:8px;object-fit:cover;}
  .chip-foto span{font-size:11px;font-weight:600;}
  .error{color:var(--danger);font-size:13px;margin-top:6px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ---------- CONFIG ----------
const SUPABASE_URL = "https://ldkgwtdlajoodwsattex.supabase.co";
const SUPABASE_KEY = "sb_publishable_HUFpcJLnKSeQ3EiXXco0iw_PXv73xgO";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true,
    storage: window.localStorage,
  },
});

const STATUS_LABEL = {aguardando:'Aguardando', em_producao:'Em produção', pronto:'Pronto', entregue:'Entregue'};
const STATUS_NEXT = {aguardando:'em_producao', em_producao:'pronto', pronto:'entregue'};

let state = {
  session: null,
  tab: 'hoje',
  hojeData: new Date().toISOString().slice(0,10),
  pessoaTipo: 'costureiras',
  materiaisView: 'lista',
  estoqueCat: 'Todas',
  produtos: { potenciaId: null, tipoId: null, ritoId: null, cargoId: null },
};

const app = document.getElementById('app');

function fmtDate(d){
  if(!d) return '';
  const [y,m,day] = d.split('-');
  return `${day}/${m}/${y}`;
}
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function money(v){ return (v==null?0:Number(v)).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }

// ---------- FOTOS DE FICHAS (produtos) ----------
function fichaThumbUrl(f){
  const fotos = (f?.ficha_fotos||[]).slice().sort((a,b)=>a.ordem-b.ordem);
  return fotos[0]?.url || '';
}
function fichaThumbImg(f, size){
  size = size || 44;
  const url = fichaThumbUrl(f);
  if(!url) return `<div class="foto-thumb" style="width:${size}px;height:${size}px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted);text-align:center;">sem foto</div>`;
  return `<img src="${url}" class="foto-thumb" style="width:${size}px;height:${size}px;flex-shrink:0;">`;
}
// reduz a foto antes de enviar (mais rápido e ocupa menos espaço)
async function comprimirFoto(file){
  try{
    const img = await new Promise((ok,err)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=err; i.src=URL.createObjectURL(file); });
    const max=1200, k=Math.min(1, max/Math.max(img.width,img.height));
    const cv=document.createElement('canvas'); cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    const blob = await new Promise(ok=>cv.toBlob(ok,'image/jpeg',0.82));
    return blob ? new File([blob], 'foto.jpg', {type:'image/jpeg'}) : file;
  }catch(e){ return file; }
}
async function uploadFotoFicha(fichaId, file){
  file = await comprimirFoto(file);
  const ext = (file.name.split('.').pop()||'jpg').toLowerCase();
  const path = `${fichaId}/${Date.now()}.${ext}`;
  const { error: upErr } = await sb.storage.from('fotos').upload(path, file, { upsert: true, contentType: file.type });
  if(upErr) return { error: upErr };
  const { data } = sb.storage.from('fotos').getPublicUrl(path);
  const { error } = await sb.from('ficha_fotos').insert({ ficha_id: fichaId, url: data.publicUrl });
  return { error };
}
async function editarFotoFicha(fichaId, nome){
  const { data: fotos } = await sb.from('ficha_fotos').select('*').eq('ficha_id', fichaId).order('ordem');
  showModal(`
    <h2>Foto — ${nome} <button class="close" onclick="closeModal()">&times;</button></h2>
    <div id="ff-fotos" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
      ${(fotos||[]).map(f=>`
        <div style="position:relative;">
          <img src="${f.url}" class="foto-thumb" style="width:80px;height:80px;">
          <button class="btn danger sm" style="position:absolute;top:-6px;right:-6px;padding:1px 7px;border-radius:50%;" onclick="removerFotoFicha('${f.id}','${fichaId}','${nome.replace(/'/g,"\\'")}')">&times;</button>
        </div>`).join('') || '<p class="muted">Nenhuma foto ainda.</p>'}
    </div>
    <label>Adicionar foto (câmera ou galeria)</label>
    <input type="file" id="ff-foto" accept="image/*">
    <button class="btn block gold" style="margin-top:14px;" onclick="salvarFotoFicha('${fichaId}','${nome.replace(/'/g,"\\'")}')">Enviar foto</button>
    <p id="ff-msg" class="error"></p>
  `);
}
async function salvarFotoFicha(fichaId, nome){
  const file = document.getElementById('ff-foto').files[0];
  const msg = document.getElementById('ff-msg');
  if(!file){ msg.textContent='Escolha uma foto.'; return; }
  msg.textContent = 'Enviando...'; msg.className='muted';
  const { error } = await uploadFotoFicha(fichaId, file);
  if(error){ msg.textContent = error.message; msg.className='error'; return; }
  await editarFotoFicha(fichaId, nome);
}
async function removerFotoFicha(fotoId, fichaId, nome){
  await sb.from('ficha_fotos').delete().eq('id', fotoId);
  await editarFotoFicha(fichaId, nome);
}
function fichaPickerListHtml(fichas, onClickFnName){
  return (fichas||[]).map(f=>{
    const url = fichaThumbUrl(f);
    return `
    <div class="item calc-opcao" data-nome="${(f.nome||'').toLowerCase()}" style="cursor:pointer;padding:8px 10px;" onclick="${onClickFnName}('${f.id}')">
      ${url?`<img src="${url}" class="foto-thumb">`:`<div class="foto-thumb" style="display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:9px;text-align:center;">sem foto</div>`}
      <div style="flex:1;">
        <div>${f.nome}</div>
        <div class="muted" style="font-size:11px;">${f.unidade_producao}</div>
      </div>
      <button class="btn ghost sm" onclick="event.stopPropagation(); editarFotoFicha('${f.id}','${(f.nome||'').replace(/'/g,"\\'")}')">📷</button>
    </div>`;
  }).join('') || '<p class="muted" style="padding:10px;">Nenhum tipo de peça cadastrado ainda.</p>';
}
function filtrarFichaPicker(inputId, listId){
  const q = document.getElementById(inputId).value.toLowerCase();
  document.querySelectorAll('#'+listId+' .calc-opcao').forEach(el=>{
    el.style.display = el.dataset.nome.includes(q) ? 'flex' : 'none';
  });
}

// ---------- BOOT ----------
async function boot(){
  const { data } = await sb.auth.getSession();
  state.session = data.session;
  sb.auth.onAuthStateChange((_event, session) => {
    state.session = session;
    render();
  });
  render();
}
boot();

function render(){
  // acesso direto, sem login por e-mail
  renderApp();
}

// ---------- LOGIN ----------
function renderLogin(){
  app.innerHTML = `
    <div class="wrap" style="padding-top:70px;">
      <div class="center" style="margin-bottom:30px;">
        <p class="eyebrow">Zênite</p>
        <h1 style="font-size:28px;">Produção</h1>
        <p class="muted">Controle de produção dos paramentos</p>
      </div>
      <div class="card">
        <label>Seu e-mail</label>
        <input id="login-email" type="email" placeholder="allynekarvalho@hotmail.com" autocomplete="email">
        <button class="btn block" style="margin-top:14px;" onclick="doLogin()">Enviar link de acesso</button>
        <p id="login-msg" class="muted" style="margin-top:10px;"></p>
      </div>
    </div>`;
}

async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const msg = document.getElementById('login-msg');
  if(!email){ msg.textContent = 'Digite seu e-mail.'; msg.className='error'; return; }
  msg.textContent = 'Enviando...'; msg.className='muted';
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: window.location.href } });
  if(error){ msg.textContent = 'Erro: ' + error.message; msg.className='error'; return; }
  msg.textContent = 'Link enviado! Abra seu e-mail e toque no link pra entrar.';
  msg.className='muted';
}

// ---------- APP SHELL ----------
function renderApp(){
  app.innerHTML = `
    <div class="wrap">
      <div class="topbar">
        <div>
          <p class="eyebrow">Zênite</p>
          <h1>Produção</h1>
        </div>
      </div>
      <div id="content"></div>
    </div>
    <div class="navbottom">
      ${navBtn('hoje','Hoje')}
      ${navBtn('pedidos','Pedidos')}
      ${navBtn('produtos','Produtos')}
      ${navBtn('materiais','Estoque')}
      ${navBtn('costureiras','Equipe')}
    </div>
  `;
  loadTab();
}
function navBtn(id,label){
  return `<button class="${state.tab===id?'active':''}" onclick="switchTab('${id}')">${label}</button>`;
}
function switchTab(id){ state.tab = id; state.materiaisView = 'lista'; renderApp(); }

function loadTab(){
  const c = document.getElementById('content');
  c.innerHTML = `<div class="spinner"></div>`;
  if(state.tab==='hoje') renderHoje();
  else if(state.tab==='pedidos') renderPedidos();
  else if(state.tab==='costureiras') renderEquipe();
  else if(state.tab==='produtos') renderProdutos();
  else if(state.tab==='materiais') renderMateriais();
  else if(state.tab==='relatorio') renderRelatorio();
}

// ================= HOJE =================
async function renderHoje(){
  const c = document.getElementById('content');
  const dia = state.hojeData;
  const { data: pecas, error } = await sb.from('pecas')
    .select('*, fichas_tecnicas!pecas_ficha_id_fkey(nome, ficha_fotos(url,ordem)), pedidos(numero, prazo, urgente, clientes(nome)), costureiras(nome), faccionistas(nome)')
    .eq('dia_producao', dia)
    .order('criado_em');

  let html = `
    <div class="row" style="margin-bottom:14px;">
      <button class="btn ghost sm" onclick="mudarDia(-1)">‹ Anterior</button>
      <input type="date" value="${dia}" onchange="state.hojeData=this.value; loadTab();" style="text-align:center;">
      <button class="btn ghost sm" onclick="mudarDia(1)">Próximo ›</button>
    </div>`;

  if(error){ html += `<p class="error">Erro ao carregar: ${error.message}</p>`; c.innerHTML = html; return; }
  if(!pecas || pecas.length===0){
    html += `<div class="card center muted">Nada programado para ${fmtDate(dia)}.</div>`;
    c.innerHTML = html; return;
  }

  // ordenar urgentes/prazo vencendo no topo
  pecas.sort((a,b) => {
    const au = a.pedidos?.urgente ? 0 : 1, bu = b.pedidos?.urgente ? 0 : 1;
    return au - bu;
  });

  html += pecas.map(p => {
    const urgente = p.pedidos?.urgente;
    const prazo = p.pedidos?.prazo;
    const venceLogo = prazo && (new Date(prazo) - new Date(dia))/86400000 <= 2;
    const quem = p.costureiras?.nome || p.faccionistas?.nome || '—';
    return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
        <div style="display:flex;gap:10px;">
          ${fichaThumbImg(p.fichas_tecnicas)}
          <div>
            <strong>${p.fichas_tecnicas?.nome || 'Peça'}</strong> ×${p.quantidade}
            <div class="muted">${p.pedidos?.clientes?.nome || ''} · Pedido #${p.pedidos?.numero || ''}</div>
            <div class="muted">Responsável: ${quem}</div>
          </div>
        </div>
        <div style="text-align:right;">
          ${urgente ? '<span class="pill urgente">Urgente</span>' : ''}
          ${venceLogo ? `<div class="muted" style="color:var(--danger);font-size:11px;">Prazo ${fmtDate(prazo)}</div>` : ''}
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;">
        <span class="pill ${p.status}">${STATUS_LABEL[p.status]}</span>
        ${STATUS_NEXT[p.status] ? `<button class="btn sm" onclick="avancarStatus('${p.id}','${STATUS_NEXT[p.status]}')">Marcar ${STATUS_LABEL[STATUS_NEXT[p.status]]}</button>` : ''}
      </div>
    </div>`;
  }).join('');

  c.innerHTML = html;
}
function mudarDia(delta){
  const d = new Date(state.hojeData + 'T12:00:00');
  d.setDate(d.getDate()+delta);
  state.hojeData = d.toISOString().slice(0,10);
  loadTab();
}
async function avancarStatus(id, novo){
  const patch = { status: novo };
  if(novo === 'pronto') patch.data_pronto = todayISO();
  const { error } = await sb.from('pecas').update(patch).eq('id', id);
  if(error){ alert('Erro: ' + error.message); return; }
  loadTab();
}

// ================= PRODUTOS (catálogo: potência / tipo / rito) =================
function chipsHtml(items, selectedId, fnName){
  return (items||[]).map(it => `
    <button type="button" class="chip ${it.id===selectedId?'active':''}" data-nome="${(it.nome||'').toLowerCase()}" onclick="${fnName}('${it.id}')">${it.nome}</button>
  `).join('') || '<p class="muted" style="padding:4px 0;">Nenhum cadastrado ainda.</p>';
}
function filtrarChips(inputId, listId){
  const q = document.getElementById(inputId).value.toLowerCase();
  document.querySelectorAll('#'+listId+' .chip').forEach(el=>{
    el.style.display = el.dataset.nome.includes(q) ? 'inline-flex' : 'none';
  });
}

async function renderBordados(alvo){
  const c = alvo || document.getElementById('est-bord-partes') || document.getElementById('content');
  const { data } = await sb.from('fichas_tecnicas').select('id,nome,custo_bordado').eq('tipo','bordado').eq('ativo', true).order('nome');
  const nm = (n) => escAttr(String(n||'').replace(/^Bordado · /,''));
  c.innerHTML = `
    <h2 style="font-size:15px;margin:20px 0 4px;">🪡 Partes bordadas pelo Pedro</h2>
    <p class="muted" style="font-size:13px;margin-top:0;">Partes bordadas (ex.: corpo e abeta do avental). Cadastre aqui e depois, em cada produto, diga quantos de cada ele leva em <b>"🪡 Bordados desta peça"</b>. O custo entra no custo do produto.</p>
    <div class="card">${(data||[]).map(b => `
      <div class="item" style="gap:8px;">
        <span style="flex:1">${nm(b.nome)}</span>
        <input inputmode="decimal" placeholder="custo" style="width:90px;text-align:right;" value="${b.custo_bordado!=null ? String(b.custo_bordado).replace('.',',') : ''}" onchange="salvarCustoBordado('${b.id}',this)">
        <button class="btn sm ghost" style="color:var(--danger);" onclick="excluirBordado('${b.id}')">✕</button>

async function criarOuSelecionarCatalogo(tabela, nome, extraCols, listaExistente, fnSelecionar){
  const existente = (listaExistente||[]).find(x => x.nome.toLowerCase() === nome.toLowerCase());
  if(existente){ fnSelecionar(existente.id); return true; }
  const { data, error } = await sb.from(tabela).insert({ nome, ...extraCols }).select().single();
  if(error){ alert(error.message); return false; }
  fnSelecionar(data.id);
  return true;
}

async function uploadParaStorage(prefixoPasta, file){
  file = await comprimirFoto(file);
  const ext = (file.name.split('.').pop()||'jpg').toLowerCase();
  const path = `${prefixoPasta}/${Date.now()}.${ext}`;
  const { error } = await sb.storage.from('fotos').upload(path, file, { upsert: true, contentType: file.type });
  if(error) return { error };
  const { data } = sb.storage.from('fotos').getPublicUrl(path);
  return { url: data.publicUrl };
}

async function salvarEdicaoProduto(fichaId){
  const msg = document.getElementById('epf-msg');
  const nome = document.getElementById('epf-nome').value.trim();
  if(!nome){ msg.textContent = 'Informe o nome.'; return; }
  const semMedida = materiaisSemMedida('epf');
  if(semMedida){ msg.textContent = `Informe a medida usada de "${semMedida}" nesse paramento.`; return; }
  const patch = {
    nome,
    unidade_producao: document.getElementById('epf-unidade').value.trim() || 'peça',
    outros_aviamentos: document.getElementById('epf-outros_aviamentos').value.trim() || null,
    servico_id: (window._pmServ||{})['epf'] || null,
    custo_corte: (window._pmCorteVal||{})['epf'] ?? null,
  };
  const { error } = await sb.from('fichas_tecnicas').update(patch).eq('id', fichaId);
  if(error){ msg.textContent = error.message; return; }
  await salvarListaMateriais('epf', fichaId);
  for(const inp of document.querySelectorAll('.epf-bord')){
    const q = Number(inp.value)||0, b = inp.dataset.b, antes = (window._bdSel||{})[b]||0;
    if(q === antes) continue;
    if(q > 0) await sb.from('ficha_bordados').upsert({ ficha_id: fichaId, bordado_id: b, quantidade: q }, { onConflict: 'ficha_id,bordado_id' });
    else await sb.from('ficha_bordados').delete().eq('ficha_id', fichaId).eq('bordado_id', b);
  }
  const fotoInput = document.getElementById('epf-foto');
  const file = fotoInput?.files[0];
  if(file){

  }
  closeModal();
  carregarProdutosFiltrados();
}

async function renderPedidos(){
  const c = document.getElementById('content');
  const { data: pedidos, error } = await sb.from('pedidos')
    .select('*, clientes(nome), pecas(id,status)')
    .order('criado_em', { ascending: false });

  let html = `<button class="btn block" onclick="abrirNovoPedido()">+ Novo pedido</button><div style="height:14px;"></div>`;
  if(error){ html += `<p class="error">${error.message}</p>`; c.innerHTML = html; return; }
  if(!pedidos || pedidos.length===0){ html += `<div class="card center muted">Nenhum pedido ainda.</div>`; c.innerHTML = html; return; }

  html += pedidos.map(p => {
    const total = p.pecas?.length || 0;
    const prontos = p.pecas?.filter(x=>x.status==='pronto'||x.status==='entregue').length || 0;
    return `
    <div class="card" onclick="abrirPedido('${p.id}')" style="cursor:pointer;">
      <div style="display:flex;justify-content:space-between;">
        <strong>#${p.numero} · ${p.clientes?.nome || ''}</strong>
        ${p.urgente ? '<span class="pill urgente">Urgente</span>' : ''}
      </div>
      <div class="muted">Prazo: ${p.prazo ? fmtDate(p.prazo) : '—'} · ${prontos}/${total} peças prontas</div>
    </div>`;
  }).join('');
  c.innerHTML = html;
}

// Nível de costura: metal maçônico no produto = detalhe; plástico vem do pedido
async function nivelDaPeca(fichaId, plastico){
  const { data: f } = await sb.from('fichas_tecnicas').select('id,nome,servico_id,tipo_peca_id, tipos_peca(nome)').eq('id', fichaId).single();
  if(!f) return null;
  let tipo = (f.tipos_peca && f.tipos_peca.nome) || '';
  if(!/^(Avental|Colar|Faixa)$/i.test(tipo)){ const m = String(f.nome).match(/^(Avental|Colar|Faixa)/i); tipo = m ? m[1] : ''; }
  if(!tipo) return f.servico_id ? { servico_id: f.servico_id, nivel: null } : null;
  tipo = tipo[0].toUpperCase() + tipo.slice(1).toLowerCase();
  const { data: fm } = await sb.from('ficha_materiais').select('materiais(categoria)').eq('ficha_id', fichaId);
  const metal = (fm||[]).some(r => r.materiais && r.materiais.categoria === 'Metais maçônicos');
  const nivel = metal && plastico ? 3 : (metal || plastico ? 2 : 1);
  const { data: sv } = await sb.from('fichas_tecnicas').select('id,nome').eq('nome', `${tipo} · Nível ${nivel}`).eq('ativo', true).limit(1);
  return { servico_id: sv && sv[0] ? sv[0].id : f.servico_id, nivel, nome: sv && sv[0] ? sv[0].nome : null };
}
async function valorCostureiraServico(costureiraId, servicoId){
  const { data: own } = await sb.from('costureira_valores').select('valor').eq('costureira_id', costureiraId).eq('ficha_id', servicoId).maybeSingle();
  if(own) return Number(own.valor);
  const { data: c } = await sb.from('costureiras').select('tabela').eq('id', costureiraId).single();
  const { data: pt } = await sb.from('precos_tabela').select('valor').eq('tabela', c && Number(c.tabela)===1 ? 1 : 2).eq('ficha_id', servicoId).maybeSingle();
  return pt ? Number(pt.valor) : null;
}

async function salvarNovoPedido(){
  const msg = document.getElementById('np-msg');
  let clienteId = document.getElementById('np-cliente').value;
  if(!clienteId){
    const nome = document.getElementById('np-cliente-nome').value.trim();
    if(!nome){ msg.textContent = 'Informe o nome do cliente.'; return; }
    const tipo = document.getElementById('np-cliente-tipo').value;
    const dados = lerClienteCampos('npc'); Object.keys(dados).forEach(k => { if(dados[k]==null) delete dados[k]; });
    const { data: existe } = await sb.from('clientes').select('id').ilike('nome', nome).limit(1);
    if(existe && existe.length){ clienteId = existe[0].id; await sb.from('clientes').update({ tipo, ...dados }).eq('id', clienteId); }
    else {
      const { data, error } = await sb.from('clientes').insert({ nome, tipo, ...dados }).select().single();
      if(error){ msg.textContent = error.message; return; }
      clienteId = data.id;
    }
  }
  const prazo = document.getElementById('np-prazo').value || null;
  const urgente = document.getElementById('np-urgente').checked;
  const observacao = document.getElementById('np-obs').value;
  const { data, error } = await sb.from('pedidos').insert({ cliente_id: clienteId, prazo, urgente, observacao }).select().single();
  if(error){ msg.textContent = error.message; return; }

  if(npPecas.length){
    const linhas = npPecas.map(p => ({
      pedido_id: data.id, ficha_id: p.ficha_id, quantidade: p.quantidade,
      dia_producao: p.dia_producao, costureira_id: p.costureira_id, faccionista_id: p.faccionista_id,
      valor_costureira: p.valor_costureira, valor_faccionista: p.valor_faccionista,
      com_plastico: !!p.com_plastico, servico_id: p.servico_id || null,
    }));
    const { error: errPecas } = await sb.from('pecas').insert(linhas);
    if(errPecas){ msg.textContent = 'Pedido criado, mas houve erro ao salvar as peças: ' + errPecas.message; }
  }
  npPecas = []; npFormCache = null;
  closeModal();
  await abrirPedido(data.id);
}

// soma os bordados (por parte) das peças do pedido
async function bordadosDoPedido(pecas){
  const div = document.getElementById('pedido-bordados'); if(!div) return;
  const ids = [...new Set(pecas.map(p=>p.ficha_id).filter(Boolean))];
  if(!ids.length){ div.textContent = 'Nenhuma peça ainda.'; return; }
  const { data: fb } = await sb.from('ficha_bordados').select('ficha_id, quantidade, bordado:fichas_tecnicas!ficha_bordados_bordado_id_fkey(nome)').in('ficha_id', ids);
  const tot = {};
  pecas.forEach(p => (fb||[]).filter(r=>r.ficha_id===p.ficha_id).forEach(r => {
    const n = (r.bordado&&r.bordado.nome||'').replace('Bordado · ',''); tot[n] = (tot[n]||0) + (Number(r.quantidade)||0)*(Number(p.quantidade)||0);
  }));
  const ls = Object.entries(tot).filter(x=>x[1]>0);
  div.innerHTML = ls.length ? ls.map(([n,q]) => `<div class="item"><span style="color:var(--ink);">${escAttr(n)}</span><strong style="color:var(--ink);">${q}</strong></div>`).join('') : 'As peças deste pedido não têm bordado cadastrado.';
}
async function materiaisDoPedido(pecas){
  const div = document.getElementById('pedido-materiais'); if(!div) return;
  const fichaIds = [...new Set(pecas.map(p=>p.ficha_id).filter(Boolean))];
  if(!fichaIds.length){ div.textContent = 'Nenhuma peça ainda.'; return; }
  const { data: fm } = await sb.from('ficha_materiais').select('ficha_id, quantidade_por_unidade, materiais(*)').in('ficha_id', fichaIds);
  const tot = {};
  pecas.forEach(p => (fm||[]).filter(r=>r.ficha_id===p.ficha_id && r.materiais).forEach(r => {
    const k = r.materiais.id; tot[k] = tot[k] || { m: r.materiais, q: 0 };
    tot[k].q += (Number(r.quantidade_por_unidade)||0) * (Number(p.quantidade)||0);
  }));
  const linhas = Object.values(tot);
  if(!linhas.length){ div.textContent = 'Os produtos deste pedido ainda não têm lista de materiais.'; return; }
  let custoTot = 0;
  div.innerHTML = linhas.map(x => {
    const est = Number(x.m.estoque_atual)||0; const cu = custoUnit(x.m); if(cu!=null) custoTot += cu*x.q;
    return `<div class="item"><span style="color:var(--ink);">${x.m.nome}${detalheMaterial(x.m)?`<div class="muted" style="font-size:11px;">${detalheMaterial(x.m)}</div>`:''}</span><span style="text-align:right;white-space:nowrap;"><b style="color:var(--ink);">${fmtQtd(x.q, x.m.unidade)}</b><div style="font-size:11px;color:${est<0?'var(--danger)':'var(--muted)'};">estoque: ${fmtQtd(est, x.m.unidade)}</div></span></div>`;
  }).join('') + `<div style="display:flex;justify-content:space-between;padding:10px 0;color:var(--ink);"><strong>💰 Custo de material do pedido</strong><strong>${money(custoTot)}</strong></div>` + '<p class="muted" style="font-size:11px;margin-top:6px;">Esse material já sai do estoque quando a peça é lançada no pedido.</p>';
}

async function salvarPeca(pedidoId){
  const msg = document.getElementById('pc-msg');
  const ficha_id = document.getElementById('pc-ficha').value;
  if(!ficha_id){ msg.textContent = 'Escolha o tipo de peça.'; return; }
  const quantidade = Number(document.getElementById('pc-qtd').value) || 1;
  const dia_producao = document.getElementById('pc-dia').value || null;
  const { costureira_id, faccionista_id } = lerResponsavel('pc');

  let valor_costureira = null, valor_faccionista = null;
  if(costureira_id){
    const { data } = await sb.from('costureira_valores').select('valor').eq('costureira_id', costureira_id).eq('ficha_id', ficha_id).maybeSingle();
    valor_costureira = data?.valor ?? null;
  }
  if(faccionista_id){
    const { data } = await sb.from('faccionista_valores').select('valor').eq('faccionista_id', faccionista_id).eq('ficha_id', ficha_id).maybeSingle();
    valor_faccionista = data?.valor ?? null;
  }

  const com_plastico = !!document.getElementById('pc-plastico')?.checked;
  const nv = await nivelDaPeca(ficha_id, com_plastico);
  if(costureira_id && nv && nv.servico_id && valor_costureira == null) valor_costureira = await valorCostureiraServico(costureira_id, nv.servico_id);
  const { error } = await sb.from('pecas').insert({
    pedido_id: pedidoId, ficha_id, quantidade, dia_producao, costureira_id, faccionista_id, valor_costureira, valor_faccionista,
    com_plastico, servico_id: nv ? nv.servico_id : null

  if(error){ msg.textContent = error.message; return; }
  closeModal();
  await abrirPedido(pedidoId);
}

// dias de segunda a sexta do mês (AAAA-MM)
function diasUteisMes(mes){
  const [y, m] = mes.split('-').map(Number), ult = new Date(y, m, 0).getDate(); let n = 0;
  for(let d=1; d<=ult; d++){ const w = new Date(y, m-1, d).getDay(); if(w>0 && w<6) n++; }
  return n;
}
function mesSeguinte(mes){ const [y,m] = mes.split('-').map(Number); return m===12 ? `${y+1}-01` : `${y}-${String(m+1).padStart(2,'0')}`; }
function mesAnterior(mes){ const [y,m] = mes.split('-').map(Number); return m===1 ? `${y-1}-12` : `${y}-${String(m-1).padStart(2,'0')}`; }
function nomeMes(mes){ const [y,m] = mes.split('-'); return PL_MESES[Number(m)-1]+'/'+y; }
function rotMes(mes){ const [y,m] = mes.split('-'); return ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][Number(m)-1]+'/'+y.slice(2); }
// salário é do mês trabalhado; VT/VA são adiantados para o mês seguinte
function plDiasMes(){
  const mes = document.getElementById('pl-mes').value; if(!mes) return;
  const prox = mesSeguinte(mes);
  document.getElementById('pl-dias').value = diasUteisMes(prox);
  document.getElementById('pl-dias-lbl').textContent = 'Dias úteis de '+nomeMes(prox)+' (VT/VA)';
}
function plSalCalc(){
  const p = window._plPessoaFull || {}, uteis = Number((document.getElementById('pl-dias')||{}).value)||0, faltas = Number((document.getElementById('pl-faltas')||{}).value)||0, atest = Number((document.getElementById('pl-atest')||{}).value)||0, dias = Math.max(0, uteis - faltas - atest);
  const sal = Number(p.salario)||0, vt = (Number(p.vt_passagem)||0) * (Number(p.vt_por_dia)||0) * dias;
  const desc = p.vt_desconto !== false ? Math.min(vt, +(sal*0.06).toFixed(2)) : 0;
  const va = (Number(p.va_por_dia)||0) * dias;
  const descFalta = +((sal/30) * faltas).toFixed(2);
  return { sal, vt, desc, va, dias, faltas, atest, descFalta, total: sal - descFalta + vt - desc + va };
}
function plSalPrev(){
  const el = document.getElementById('pl-salprev'); if(!el) return;
  const c = plSalCalc();
  const fx = []; if(c.faltas) fx.push(c.faltas+' sem motivo'); if(c.atest) fx.push(c.atest+' com atestado');
  const mes = (document.getElementById('pl-mes')||{}).value || todayISO().slice(0,7), prox = mesSeguinte(mes);
  el.innerHTML = `<b>Salário de ${nomeMes(mes)}</b>${fx.length?` (faltas: ${fx.join(', ')})`:''}<br>Salário ${money(c.sal)}${c.descFalta?` − faltas ${money(c.descFalta)}`:''}<br><b>VT e VA de ${nomeMes(prox)}</b>: ${c.dias} dias${(c.faltas+c.atest)?' (já descontadas as faltas)':''}<br>+ VT ${money(c.vt)}${c.desc?` − desconto 6% ${money(c.desc)}`:''}<br>+ VA ${money(c.va)}<br><b>= ${money(c.total)}</b>`;
}
async function plLancarSalario(pessoaId){

  const itens = [['Salário', c.sal], ['Desconto faltas sem motivo ('+c.faltas+(c.faltas>1?' dias':' dia')+')', -c.descFalta], ['Vale transporte '+rotP+' ('+c.dias+' dias'+sf+')', c.vt], ['Desconto VT 6%', -c.desc], ['Vale alimentação '+rotP+' ('+c.dias+' dias'+sf+')', c.va]].filter(i => Math.abs(Number(i[1])) > 0.009);

// agrupa por mês com cabeçalho "Peças produzidas em outubro/2026"
const PL_MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function plPorMes(itens, linhaFn){
  const g = {}; itens.forEach(l => { const m = (l.data||'').slice(0,7); (g[m]=g[m]||[]).push(l); });
  return Object.keys(g).sort().map(m => {
    const [y, mm] = m.split('-'), t = g[m].reduce((s,l)=>s+(Number(l.quantidade)||0)*(Number(l.valor_unit)||0),0);

      <strong style="font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--gold, #c4a574);">${PL_MESES[Number(mm)-1]||''}/${y||''}</strong>
      <span class="muted" style="font-size:13px;">${money(t)}</span></div>` + g[m].map(linhaFn).join('');
  }).join('');

function plNum(v){ return Number(String(v||'').replace(/\./g,'').replace(',','.')) || 0; }
function plServicoDe(id){ const f = (window._plFichas||{})[id]; return (f && f.tipo==='produto' && f.servico_id && (window._plFichas||{})[f.servico_id]) ? f.servico_id : id; }

function calcCortes(fm, qtd){
  const m = fm.materiais || {}, e = embInfo(m), corte = Number(fm.corte)||0, q = Number(fm.quantidade_por_unidade)||0;
  if(!e || !(corte > 0) || !(q > 0)) return null;
  const porRolo = Math.floor(e.q/corte + 1e-9); if(porRolo < 1) return null;
  const cortesPorUn = Math.ceil(q/corte - 1e-9), cortes = cortesPorUn*qtd, rolos = Math.ceil(cortes/porRolo);
  return { e, corte, porRolo, cortesPorUn, cortes, rolos, sobra: +(e.q - porRolo*corte).toFixed(2) };
}

function emTxt(v, e, unidade){

  var inteiros = Math.floor(t/e.q + 1e-9), resto = Math.round((t - inteiros*e.q)*100)/100;

function fatorEmb(p){ const emb=document.getElementById(p+'-emb').value, q=Number(document.getElementById(p+'-qpe').value)||0; return (emb && q>0) ? q : 1; }
async function lerFormMaterial(p, msg){
  const nome = document.getElementById(`${p}-nome`).value.trim();
  if(!nome){ msg.textContent = 'Informe o nome do material.'; return null; }
  if(document.getElementById(`${p}-emb`).value && !(Number(document.getElementById(`${p}-qpe`).value)>0)){ msg.textContent = 'Informe quanto vem em cada '+document.getElementById(`${p}-emb`).value+'.'; return null; }
  let fornecedor_id = document.getElementById(`${p}-fornecedor`).value;
  const fornecedorNome = document.getElementById(`${p}-fornecedor-nome`).value.trim();
  if(!fornecedor_id && fornecedorNome){
    const { data, error } = await sb.from('fornecedores').insert({ nome: fornecedorNome }).select().single();
    if(error){ msg.textContent = error.message; return null; }
    fornecedor_id = data.id;
  }
  let foto_url = document.getElementById(`${p}-foto-atual`).value || null;
  const file = document.getElementById(`${p}-foto`).files[0];
  if(file){
    msg.textContent = 'Enviando foto...';
    const up = await uploadParaStorage('materiais', file);
    if(up.error){ msg.textContent = 'Falhou ao enviar a foto: ' + up.error.message; return null; }
    foto_url = up.url;
  } else {
    const op = document.getElementById(`${p}-foto-opcao`)?.value;
    if(op) foto_url = op;
  }
  const v = id => document.getElementById(`${p}-${id}`).value.trim() || null;
  return {
    nome, categoria: v('categoria'), marca: v('marca'), cor: v('cor'), numero: v('numero'), tamanho: v('tamanho'),
    unidade: document.getElementById(`${p}-unidade`).value,
    embalagem: document.getElementById(`${p}-emb`).value || null,
    preco: (parseFloat(String(document.getElementById(`${p}-preco`).value).replace(/\./g,'').replace(',','.'))||null),
    qtd_por_embalagem: document.getElementById(`${p}-emb`).value ? (Number(document.getElementById(`${p}-qpe`).value) || null) : null,
    fornecedor_id: fornecedor_id || null, referencia: v('ref'),
    estoque_atual: (Number(document.getElementById(`${p}-estoque`).value) || 0) * fatorEmb(p),
    estoque_minimo: (Number(document.getElementById(`${p}-minimo`).value) || 0) * fatorEmb(p),
    foto_url,
  };
}

async function receitaRender(compId){

    sb.from('material_receita').select('id,material_id,quantidade').eq('componente_id', compId),

  const mm = {}; (mats||[]).forEach(x => mm[x.id] = x);
  let custo = 0;
  box.classList.remove('muted');
  box.innerHTML = (rec||[]).map(r => { const x = mm[r.material_id]||{}; const cu = custoUnit(x); if(cu!=null) custo += cu*Number(r.quantidade);
    return `<div class="item" style="gap:8px;"><span style="flex:1">${escAttr(x.nome||'?')}</span>
      <input inputmode="decimal" style="width:80px;text-align:right;" value="${String(r.quantidade).replace('.',',')}" onchange="receitaQtd('${r.id}',this.value,'${compId}')"><span class="muted" style="font-size:12px;">${x.unidade||''}</span>
      <button class="btn sm ghost" style="color:var(--danger);" onclick="receitaTirar('${r.id}','${compId}')">✕</button></div>`; }).join('') +
    `<div class="row" style="gap:6px;margin-top:8px;"><select id="rec-mat" style="flex:2"><option value="">+ material...</option>${(mats||[]).filter(x=>x.categoria!=='Corpos e abetas').map(x=>`<option value="${x.id}">${escAttr(x.nome)}</option>`).join('')}</select>
      <input id="rec-q" inputmode="decimal" placeholder="qtd" style="flex:1"><button class="btn sm" onclick="receitaAdd('${compId}')">Adicionar</button></div>
     <div style="display:flex;justify-content:space-between;margin-top:8px;"><strong>Custo por peça</strong><strong>${money(custo)}</strong></div>`;
  await sb.from('materiais').update({ preco: +custo.toFixed(2), embalagem: null, qtd_por_embalagem: null }).eq('id', compId);
}

async function salvarProduzi(id){
  const q = Number(document.getElementById('pz-qtd').value)||0, msg = document.getElementById('pz-msg');
  if(!q){ msg.textContent = 'Informe a quantidade.'; return; }
  const { data: m } = await sb.from('materiais').select('estoque_atual').eq('id', id).single();
  const { data: rec } = await sb.from('material_receita').select('material_id,quantidade').eq('componente_id', id);
  for(const r of (rec||[])){
    const { data: x } = await sb.from('materiais').select('estoque_atual').eq('id', r.material_id).single();
    await sb.from('materiais').update({ estoque_atual: +((Number(x&&x.estoque_atual)||0) - Number(r.quantidade)*q).toFixed(3) }).eq('id', r.material_id);
  }
  const { error } = await sb.from('materiais').update({ estoque_atual: (Number(m&&m.estoque_atual)||0) + q }).eq('id', id);

async function excluirMaterial(id){
  const { count } = await sb.from('ficha_materiais').select('id', { count: 'exact', head: true }).eq('material_id', id);
  if(count){
    if(!confirm(`Esse material está em ${count} produto(s). Excluir mesmo assim? Ele será tirado desses produtos.`)) return;
    const r = await sb.from('ficha_materiais').delete().eq('material_id', id);
    if(r.error){ alert(r.error.message); return; }
  } else if(!confirm('Excluir esse material?')) return;
  const { error } = await sb.from('materiais').delete().eq('id', id);
  if(error){ alert(error.message); return; }
  closeModal(); loadTab();
}

function formatMedida(valorCm, unidade){
  if(unidade !== 'cm'){ return `${Number(valorCm).toLocaleString('pt-BR',{maximumFractionDigits:2})} ${unidade}`; }
  if(valorCm >= 100){
    return `${(valorCm/100).toLocaleString('pt-BR',{maximumFractionDigits:2})} m`;
  }
  return `${Number(valorCm).toLocaleString('pt-BR',{maximumFractionDigits:2})} cm`;
}

async function calcValorCost(fichaId){

  }
  if(v) inp.value = String(v).replace('.',',');

async function calcLancarProducao(fichaId, nomeFicha, qtd, vUn){

  const { error } = await sb.from('producao_lancamentos').insert({ pessoa_tipo: 'costureiras', pessoa_id: sel.value, ficha_id: sv.id, produto: sv.nome || nomeFicha, quantidade: qtd, valor_unit: vUn, data: document.getElementById('calc-dprod').value || todayISO() });
  if(error){ msg.textContent = 'Não lançou na produção: '+error.message; return; }
  chk.checked = false;
  msg.innerHTML = `✅ Lançado na Produção de <b>${escAttr(nomeC)}</b>: ${qtd} × ${money(vUn)} = ${money(qtd*vUn)}`;
}
// cruza a quantidade necessária com o estoque atual do material e calcula o que vai faltar
function cruzarEstoque(m, total){
  const estoque = Number(m.materiais?.estoque_atual) || 0;
  const falta = total - estoque;
  return { estoque, falta: falta > 0 ? falta : 0 };
}
function atualizarCalcTotais(){
  const div = document.getElementById('calc-resultado');
  const materiais = JSON.parse(div.dataset.materiais || '[]');
  const qtd = Number(document.getElementById('calc-qtd').value) || 0;
  const totaisDiv = document.getElementById('calc-totais');
  window._calcCusto = 0;
  totaisDiv.innerHTML = materiais.map(m => {
    const total = Number(m.quantidade_por_unidade) * qtd;
    const unidade = m.materiais?.unidade;
    const fmt = (v) => fmtQtd(v, unidade);
    let { estoque, falta } = cruzarEstoque(m, total);
    const e = embInfo(m.materiais||{}); const cu = custoUnit(m.materiais||{}); const cc = calcCortes(m, qtd);
    const custo = cu!=null ? cu*(cc ? cc.rolos*cc.e.q : total) : null; window._calcCusto = (window._calcCusto||0) + (custo||0);
    let emRolos = (e && total >= e.q) ? ` <span class="muted" style="font-size:12px;">(${emTxt(total, e, unidade)})</span>` : '';
    let faltaTxt = e ? `${Math.ceil(falta/e.q)} ${plural(e.emb, Math.ceil(falta/e.q))}` : fmt(falta);
    if(cc){
      emRolos = `<div style="font-size:13px;font-weight:700;">= ${cc.rolos} ${plural(cc.e.emb, cc.rolos)} inteiros</div><div class="muted" style="font-size:11px;">${cc.cortes} cortes de ${fmt(cc.corte)} · ${cc.porRolo} por ${cc.e.emb}${cc.sobra>0?` · sobra ${fmt(cc.sobra)} por ${cc.e.emb}`:''}</div>`;
      const inteirosEst = Math.floor(estoque/cc.e.q + 1e-9), faltaR = cc.rolos - inteirosEst;
      falta = faltaR > 0 ? faltaR : 0; faltaTxt = `${faltaR} ${plural(cc.e.emb, faltaR)}`;
    }
    return `<div class="item" style="flex-direction:column;align-items:flex-start;gap:2px;">
      <div style="display:flex;justify-content:space-between;width:100%;">
        <span style="display:flex;gap:8px;align-items:center;">${m.materiais?.foto_url?`<img src="${m.materiais.foto_url}" class="foto-thumb" style="width:40px;height:40px;">`:`<span class="foto-thumb" style="width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;">📦</span>`}<span>${m.materiais?.nome} <span class="muted" style="font-size:11px;">(${fmt(m.quantidade_por_unidade)} cada)</span></span></span><span style="text-align:right;"><b>${fmt(total)}</b>${emRolos}${custo!=null?`<div style="font-size:12px;">${money(custo)}</div>`:''}</span>
      </div>
      <div class="muted" style="font-size:12px;">Em estoque: ${fmtEstoque(m.materiais||{}, estoque)}${falta>0?` — <span style="color:#c0392b;font-weight:600;">falta ${faltaTxt}</span>`:' — ok'}</div>
    </div>`;
  }).join('') || '<p class="muted">Sem materiais cadastrados pra essa ficha.</p>';
  if(materiais.length) totaisDiv.innerHTML += `<div class="card" style="margin-top:10px;display:flex;justify-content:space-between;"><strong>💰 Custo de material (${qtd} un.)</strong><strong>${money(window._calcCusto)}</strong></div>`;
  const bds = (window._calcBordados||[]).filter(b => Number(b.quantidade) > 0);
  if(bds.length) totaisDiv.innerHTML += `<div class="card" style="margin-top:10px;"><strong>🪡 Bordados (${qtd} un.)</strong>${bds.map(b => `<div class="item"><span>${escAttr((b.bordado&&b.bordado.nome||'').replace('Bordado · ',''))}</span><strong>${(Number(b.quantidade)||0)*qtd}</strong></div>`).join('')}</div>`;
}
function imprimirCalculo(nomeFicha){
  const qtd = Number(document.getElementById('calc-qtd').value) || 0;
  const div = document.getElementById('calc-resultado');
  const materiais = JSON.parse(div.dataset.materiais || '[]');
  const gv = (id) => (document.getElementById(id)||{}).value || '';
  const dBR = (v) => v ? v.split('-').reverse().join('/') : '____/____/______';
  const vUn = Number(String(gv('calc-valor')).replace(/\./g,'').replace(',','.')) || 0;
  const _sc = document.getElementById('calc-cost'), nomeCost = (_sc && _sc.value) ? _sc.options[_sc.selectedIndex].text : '';
  calcLancarProducao(div.dataset.ficha, nomeFicha, qtd, vUn);
  const info = `<div class="info"><div><span>Costureira</span><b>${nomeCost ? nomeCost.replace(/</g,'&lt;') : '______________________'}</b></div><div><span>Quantidade</span><b>${qtd} un.</b></div><div><span>Data de produção</span><b>${dBR(gv('calc-dprod'))}</b></div><div><span>Data de entrega</span><b>${dBR(gv('calc-dent'))}</b></div><div><span>Valor por peça</span><b>${vUn ? money(vUn) : 'R$ ________'}</b></div><div><span>Valor total</span><b>${vUn ? money(vUn*qtd) : 'R$ ________'}</b></div></div>`;
  const esc = (t) => String(t==null?'':t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const linhas = materiais.map(m => {
    const mat = m.materiais || {};
    const total = Number(m.quantidade_por_unidade) * qtd;
    const fmt = (v) => fmtQtd(v, mat.unidade);
    const { estoque, falta } = cruzarEstoque(m, total);
    const e = embInfo(mat);
    const cc = calcCortes(m, qtd);
    const rolos = cc ? `<div class="s"><b>${cc.rolos} ${plural(cc.e.emb, cc.rolos)} inteiros</b></div><div class="s">${cc.cortes} cortes de ${esc(fmt(cc.corte))}</div>` : ((e && total >= e.q) ? `<div class="s">${emTxt(total, e, mat.unidade)}</div>` : '');
    const faltaTxt = e ? `${Math.ceil(falta/e.q)} ${plural(e.emb, Math.ceil(falta/e.q))}` : fmt(falta);
    return `<tr><td class="f">${mat.foto_url?`<img src="${esc(mat.foto_url)}">`:''}</td><td><b>${esc(mat.nome)}</b><div class="s">${esc(fmt(m.quantidade_por_unidade))} cada</div></td><td class="v"><b>${esc(fmt(total))}</b>${rolos}</td></tr>`;
  }).join('');
  const html = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(nomeFicha)} — ${qtd} un.</title><style>body{font-family:Arial,sans-serif;margin:20px;color:#000}h1{font-size:18px;margin:0 0 10px}.info{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;border:1px solid #ccc;border-radius:8px;padding:10px 12px;margin:0 0 14px;font-size:13px}.info span{display:block;font-size:10px;text-transform:uppercase;color:#555}p{font-size:12px;color:#555;margin:0 0 14px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 6px;border-bottom:1px solid #ccc;text-align:left;vertical-align:middle}th{font-size:11px;text-transform:uppercase;color:#555}.f{width:46px}.f img{width:40px;height:40px;object-fit:cover;border-radius:6px}.s{font-size:11px;color:#555;margin-top:2px}.v{text-align:right;white-space:nowrap}.falta{color:#c0392b;font-weight:700}button{margin-top:16px;padding:10px 18px;font-size:14px}@media print{button{display:none}}</style></head><body><h1>${esc(nomeFicha)}</h1>${info}<table><tr><th></th><th>Material</th><th class="v">Precisa</th></tr>${linhas}</table></body></html>`;
  let fr = document.getElementById('frame-impressao');
  if(fr) fr.remove();
  fr = document.createElement('iframe'); fr.id = 'frame-impressao';
  fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
  document.body.appendChild(fr);
  const d = fr.contentWindow.document; d.open(); d.write(html); d.close();
  const imgs = [...d.images]; let feito = false;
  const imprimir = () => { if(feito) return; feito = true; fr.contentWindow.focus(); fr.contentWindow.print(); };
  Promise.all(imgs.map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; }))).then(imprimir);
  setTimeout(imprimir, 2500);
}
function copiarCalculo(nomeFicha){
  const qtd = document.getElementById('calc-qtd').value;
  const div = document.getElementById('calc-resultado');
  const materiais = JSON.parse(div.dataset.materiais || '[]');
  let texto = `*${nomeFicha}* — ${qtd} un.\n\n`;
  materiais.forEach(m => {
    const total = Number(m.quantidade_por_unidade) * Number(qtd);
    const unidade = m.materiais?.unidade;
    const fmt = (v) => unidade === 'cm' ? formatMedida(v, 'cm') : `${v} ${unidade||''}`;
    const { falta } = cruzarEstoque(m, total);
    texto += `• ${m.materiais?.nome}: ${fmt(total)}${falta>0?` (falta ${fmt(falta)})`:''}\n`;
  });
  navigator.clipboard.writeText(texto).then(()=>alert('Lista copiada!')).catch(()=>alert(texto));
}

// ================= RELATÓRIO MENSAL =================
function periodoAtual(refDate){
  // fecha todo dia 20: período do dia 21 do mês anterior até dia 20 do mês de referência
  const d = refDate ? new Date(refDate+'T12:00:00') : new Date();
  let y = d.getFullYear(), m = d.getMonth();
  if(d.getDate() > 20){ m += 1; }
  const fim = new Date(y, m, 20);
  const inicio = new Date(y, m-1, 21);
  return { inicio: inicio.toISOString().slice(0,10), fim: fim.toISOString().slice(0,10) };
}
let relatorioRef = todayISO();

async function renderRelatorio(){
  const c = document.getElementById('content');
  const { inicio, fim } = periodoAtual(relatorioRef);

  const { data: pecas, error } = await sb.from('pecas')
    .select('*, fichas_tecnicas!pecas_ficha_id_fkey(nome), pedidos(numero), costureiras(id,nome), faccionistas(id,nome)')
    .eq('status', 'pronto')
    .gte('data_pronto', inicio).lte('data_pronto', fim);
  // também inclui entregue
  const { data: pecas2 } = await sb.from('pecas')
    .select('*, fichas_tecnicas!pecas_ficha_id_fkey(nome), pedidos(numero), costureiras(id,nome), faccionistas(id,nome)')
    .eq('status', 'entregue')
    .gte('data_pronto', inicio).lte('data_pronto', fim);

  const todas = [...(pecas||[]), ...(pecas2||[])];

  let html = `
    <div class="segmented"><button onclick="state.pessoaTipo='costureiras';loadTab();">Costureiras</button><button onclick="state.pessoaTipo='faccionistas';loadTab();">Faccionistas</button><button onclick="state.pessoaTipo='tabelas';loadTab();">Tabelas</button><button class="active">Fechamento</button></div>
    <p class="muted">Fecha todo dia 20. Escolha um dia do período:</p>
    <div class="row" style="margin-bottom:6px;">
      <input type="date" value="${relatorioRef}" onchange="relatorioRef=this.value; loadTab();">
    </div>
    <p class="muted" style="margin-bottom:14px;">Período: ${fmtDate(inicio)} a ${fmtDate(fim)}</p>`;

  if(error){ html += `<p class="error">${error.message}</p>`; c.innerHTML = html; return; }

  const porPessoa = {};
  let totalGeral = 0;
  todas.forEach(p => {
    if(p.costureiras){
      const k = 'c_'+p.costureiras.id;
      porPessoa[k] = porPessoa[k] || { nome: p.costureiras.nome+' (costureira)', itens: [], total: 0 };
      porPessoa[k].itens.push(p);
      porPessoa[k].total += Number(p.valor_costureira||0);
      totalGeral += Number(p.valor_costureira||0);
    }
    if(p.faccionistas){
      const k = 'f_'+p.faccionistas.id;
      porPessoa[k] = porPessoa[k] || { nome: p.faccionistas.nome+' (faccionista)', itens: [], total: 0 };
      porPessoa[k].itens.push(p);
      porPessoa[k].total += Number(p.valor_faccionista||0);
      totalGeral += Number(p.valor_faccionista||0);
    }
  });

  html += `<div class="stat" style="margin-bottom:16px;">
    <div class="card"><div class="num">${todas.length}</div><div class="muted">peças</div></div>
    <div class="card"><div class="num">${money(totalGeral)}</div><div class="muted">total do período</div></div>
  </div>`;

  const keys = Object.keys(porPessoa);
  if(keys.length===0){ html += `<div class="card center muted">Nenhuma peça finalizada nesse período.</div>`; c.innerHTML = html; return; }

  html += keys.map(k => {
    const p = porPessoa[k];
    return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;">
        <strong>${p.nome}</strong>
        <strong>${money(p.total)}</strong>
      </div>
      ${p.itens.map(i=>`<div class="item muted"><span>${i.fichas_tecnicas?.nome} ×${i.quantidade} (#${i.pedidos?.numero})</span><span>${fmtDate(i.data_pronto)}</span></div>`).join('')}
    </div>`;
  }).join('');

  try{
    const fids = [...new Set(todas.map(p=>p.ficha_id).filter(Boolean))];
    if(fids.length){
      const { data: fmr } = await sb.from('ficha_materiais').select('ficha_id, quantidade_por_unidade, materiais(*)').in('ficha_id', fids);
      let custoMat = 0;
      todas.forEach(p => (fmr||[]).filter(r=>r.ficha_id===p.ficha_id && r.materiais).forEach(r => { const cu = custoUnit(r.materiais); if(cu!=null) custoMat += cu*(Number(r.quantidade_por_unidade)||0)*(Number(p.quantidade)||0); }));
      html += `<div class="card" style="margin-top:10px;"><div style="display:flex;justify-content:space-between;"><strong>🧵 Custo de materiais das peças prontas</strong><strong>${money(custoMat)}</strong></div><div style="display:flex;justify-content:space-between;margin-top:6px;"><span>💰 Total do período (mão de obra + material)</span><strong>${money(totalGeral+custoMat)}</strong></div></div>`;
    }
  }catch(e){}
  html += `<button class="btn ghost block" style="margin-top:10px;" onclick="window.print()">Imprimir / Salvar PDF</button>`;
  c.innerHTML = html;
}

// ================= MODAL =================
function showModal(html){
  closeModal();
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.id = 'modal-bg';
  bg.onclick = (e) => { if(e.target.id==='modal-bg') closeModal(); };
  bg.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(bg);
}
function closeModal(){
  const m = document.getElementById('modal-bg');
  if(m) m.remove();
}
